locale: en-US
invocation_name: jellyfin player
tests:
  # NOTE: simulate-skill for en-US resolves most utterances to built-in Amazon
  # skills (Music, Video, etc.) rather than this custom skill. These tests are
  # retained for profile-nlu validation but may fail in simulate-skill mode.
  # Use it-IT E2E fixtures for reliable simulate-skill testing.

  # --- Playback intents ---
  - utterance: "play happy music"
    expected_intent: PlayMoodMusicIntent
    expected_slots:
      mood: {}
    expected_response_type: any

  # JF-917 (2026-10-20 audit; fix 2026-10-21): the model selects PlaySongIntent
  # for "put on music by X" (sample competition, the phantom MusicRecording
  # fill) and the fix is HANDLER-side (the JF-715 generic-word bypass extended
  # with the wrapper-particle residue: the one-shot consumes "put" and delivers
  # song "on music", which the probe now strips to the generic word). The row
  # pins the END-TO-END contract: the delivered intent stays PlaySongIntent,
  # but the response is the ARTIST play (AudioPlayer.Play of Pink Floyd), not
  # the honest not-found the pre-fix handler answered. RED-UNTIL-DEPLOY (the
  # fix rides the DLL; verified live in simulate 2026-10-20 pre-fix).
  - utterance: "ask jellyfin player to put on music by pink floyd"
    expected_intent: PlaySongIntent
    expected_slots: {}
    expected_response_type: directive
    expected_directive_type: "AudioPlayer.Play"
    expected_end_session: true
    expected_stream_url_contains: "/Audio/"

  # "play random rock songs" matches the literal (non-slotted) model sample:
  # NO slots are captured (the NLU fixture en-US.yaml documents the same
  # shape). JF-510 (2026-09-06): the previous genre/media_type slot pins were
  # stale, the slots resolve empty and the assertion failed on both live runs
  # (2026-09-06 x2); intent routing is what this entry can pin.
  - utterance: "play random rock songs"
    expected_intent: PlayRandomIntent
    expected_slots: {}
    expected_response_type: any

  - utterance: "play songs added this week"
    expected_intent: PlayLastAddedIntent
    expected_slots:
      media_type: {}
      time_period: {}
    expected_response_type: any

  # --- Info queries (speech-only responses) ---
  - utterance: "what is currently playing"
    expected_intent: MediaInfoIntent
    expected_slots: {}
    expected_response_type: any

  - utterance: "what's in progress"
    expected_intent: InProgressMediaListIntent
    expected_slots: {}
    expected_response_type: any

  # --- State change intents ---
  - utterance: "I like this song"
    expected_intent: MarkFavoriteIntent
    expected_slots: {}
    expected_response_type: any

  - utterance: "continue watching"
    expected_intent: ContinueWatchingIntent
    expected_slots: {}
    expected_response_type: any

  # --- Queue management ---
  - utterance: "what's up next"
    expected_intent: ListQueueIntent
    expected_slots: {}
    expected_response_type: any
