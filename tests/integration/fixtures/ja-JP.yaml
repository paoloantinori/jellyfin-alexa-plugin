locale: ja-JP
invocation_name: jellyfin player
tests:
  # JF-400 completion: ja-JP was the last locale without an NLU fixture (vendor-disabled
  # until JF-513 declared it in the manifest). Seeded 2026-09-12, every entry
  # probe-verified against the live model BEFORE asserting (the JF-400 program rule).
  #
  # DOCUMENTED DIVERGENCE (the JF-406 class, found while seeding): the artist path was
  # systematically stolen in ja-JP. Every carrier that is a verbatim PlayArtistSongs
  # sample lost the statistical race to PlayVideoIntent's free-form '{title}
  # を再生して' or to PlayByGenreIntent: 'クイーン の曲を再生して' -> PlayVideoIntent
  # title='クイーンの曲'; 'クイーン を再生して' -> PlayVideoIntent title='クイーン';
  # 'クイーン の音楽/トラックを再生して' -> PlayVideoIntent; 'ビートルズ の曲を聴かせて'
  # and 'クイーン の曲を流して' -> PlayByGenreIntent genre=<artist>. Only carries that
  # NAME the media noun survive (曲/アルバム/プレイリスト prefixes), which is why this
  # fixture asserted song/album/playlist but no musician slot. The media-noun-named
  # carriers are the intended ASR shape (anti-pattern #11's ja analog).
  #
  # DIVERGENCE CLOSED (2026-09-27): the PlayVideo bare '{title} を再生して' thief was
  # removed by JF-551, and the PlayByGenre steal is closed by JF-642 (the genre slot
  # is now the custom GenreType, so a non-genre word cannot fill it; the rows below
  # assert the post-fix artist routing). Katakana genre voice resolves through the
  # type's ER synonyms to the canonical Latin tag (JF-642) or, for long-tail genres,
  # through the JF-643 kana resolution tier.

  - utterance: "イマジン を再生して"
    expected_intent: PlaySongIntent
    expected_slots:
      song: {}

  - utterance: "アルバム スリラー を再生して"
    expected_intent: PlayAlbumIntent
    expected_slots:
      album: {}

  - utterance: "プレイリスト ドライブ を再生して"
    expected_intent: PlayPlaylistIntent
    expected_slots:
      playlist: {}

  - utterance: "お気に入りの曲を再生して"
    expected_intent: PlayFavoritesIntent
    expected_slots: {}

  - utterance: "ランダムに何か再生して"
    expected_intent: PlayRandomIntent
    expected_slots: {}

  - utterance: "新着はある"
    expected_intent: QueryRecentlyAddedIntent
    expected_slots: {}

  - utterance: "この曲をループして"
    expected_intent: LoopSongOnIntent
    expected_slots: {}

  - utterance: "今何が再生中"
    expected_intent: MediaInfoIntent
    expected_slots: {}

  - utterance: "次のチャプター"
    expected_intent: GoToChapterIntent
    expected_slots: {}

  - utterance: "続きを見て"
    expected_intent: ContinueWatchingIntent
    expected_slots: {}

  # Slot-fill note (probe-verified): digit forms ('10 分後に止めて', '10分後に止めて')
  # route to SleepTimerIntent but leave duration_minutes EMPTY; the kanji number word
  # ('十分後に止めて') fills it ('10'). Assert the filling form.
  - utterance: "十分後に止めて"
    expected_intent: SleepTimerIntent
    expected_slots:
      sleep_duration: {}

  # ------------------------------------------------------------------------
  # JF-399 English-inertia resolution (2026-09-12): FindSong/FindSongByArtist
  # translated to Japanese; probe-verified. PlayBook was translated too but
  # ALL its carriers are stolen by PlayVideoIntent/PlaySongIntent free-form
  # slots (the same ja steal documented in the header above) - no PlayBook
  # entry is assertable until that competition is addressed.
  # ------------------------------------------------------------------------
  - utterance: "曲を探して"
    expected_intent: FindSongIntent
    expected_slots: {}

  - utterance: "クイーン の曲を探して"
    expected_intent: FindSongByArtistIntent
    expected_slots:
      musician: {}

  # JF-399 FindSongByArtist parity pass (2026-09-26): the mitshituketai
  # carrier family. Requires the model deploy; the first live suite run
  # after it is the probe.
  - utterance: "クイーン の曲を見つけたい"
    expected_intent: FindSongByArtistIntent
    expected_slots:
      musician: {}

  # ------------------------------------------------------------------------
  # JF-642 (2026-09-27): the genre slot is the custom GenreType, so the
  # noun-qualified artist carriers below must reach PlayArtistSongsIntent
  # (the PlayByGenre steal is gone) and the katakana genre carrier must fill
  # the genre slot through the type's ER synonyms. Requires the model deploy;
  # the first live suite run after it is the probe (the same rows as the
  # orchestrator's post-merge battery).
  # ------------------------------------------------------------------------
  - utterance: "クイーン の曲を再生して"
    expected_intent: PlayArtistSongsIntent
    expected_slots:
      musician: {}

  - utterance: "クイーン のトラックを再生して"
    expected_intent: PlayArtistSongsIntent
    expected_slots:
      musician: {}

  - utterance: "queen の曲を再生して"
    expected_intent: PlayArtistSongsIntent
    expected_slots:
      musician: {}

  - utterance: "ジャズ の曲を再生して"
    expected_intent: PlayByGenreIntent
    expected_slots:
      genre: {}
