# JF-511 smoke suite (option b): two-step shape for fr-FR.
# Commands profile-nlu-verified before authoring (2026-09-07). The artist
# carrier is 'lis les chansons de {musician}': 'lis la musique de X' is
# absorbed by PlaySongIntent (song='la musique', JF-508 family).
locale: fr-FR
invocation_name: jellyfin player
open_utterance: "ouvre jellyfin player"
tests:
  - utterance: "lis mes favoris"
    expected_intent: PlayFavoritesIntent
    expected_slots: {}
    expected_response_type: directive
    expected_directive_type: "AudioPlayer.Play"
    expected_end_session: true
    expected_stream_url_contains: "/Audio/"

  # Random play with media pinned to a music word ('morceau' is not in
  # MediaTypeToItemKinds, so kinds resolve audio-only; JF-511 quirk note).
  - utterance: "joue un morceau aléatoire"
    expected_intent: PlayRandomIntent
    expected_slots:
      media_type: {}
    expected_response_type: directive
    expected_directive_type: "AudioPlayer.Play"
    expected_end_session: true
    expected_stream_url_contains: "/Audio/"

  - utterance: "lis les chansons de pink floyd"
    expected_intent: PlayArtistSongsIntent
    expected_slots:
      musician: {}
    expected_response_type: directive
    expected_directive_type: "AudioPlayer.Play"
    expected_end_session: true
    expected_stream_url_contains: "/Audio/"

  - utterance: "lis les chansons de xyzzyfoo"
    expected_intent: PlayArtistSongsIntent
    expected_slots:
      musician: {}
    expected_response_type: speech
    expected_speech_contains: "trouvé aucun artiste nommé"
    expected_end_session: true

  # JF-505 gate Tell; word-only movie title (digits normalize to 'deux').
  - utterance: "je veux regarder barbie"
    expected_intent: PlayVideoIntent
    expected_slots:
      title: {}
    expected_response_type: speech
    expected_speech_contains: "appareil avec ecran"
    expected_end_session: true

  # (e) locale-specific carrier family: the 'le film' noun carrier.
  - utterance: "mets le film barbie"
    expected_intent: PlayVideoIntent
    expected_slots:
      title: {}
    expected_response_type: speech
    expected_speech_contains: "appareil avec ecran"
    expected_end_session: true
