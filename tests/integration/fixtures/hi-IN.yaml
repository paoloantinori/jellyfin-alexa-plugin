locale: hi-IN
invocation_name: jellyfin player
tests:
  # JF-400: hi-IN had no NLU fixture file; seeded (probe-verified 2026-08-29 against the
  # live model) with the JF-414 indefinite album-by-artist forms. Both route to
  # PlayAlbumIntent with the raw musician value preserved. Extend per the JF-400 program.
  - utterance: "queen का एल्बम चलाओ"
    expected_intent: PlayAlbumIntent
    expected_slots:
      musician: {}

  - utterance: "queen का एल्बम सुनो"
    expected_intent: PlayAlbumIntent
    expected_slots:
      musician: {}

  # ------------------------------------------------------------------------
  # SetReminderIntent (reminder_duration / reminder_time), JF-451/JF-622
  # Probe-verified live 2026-09-08. The '{reminder_time} का रिमाइंडर सेट करो'
  # sample form fills the slot; the '{reminder_time} पर मुझे याद दिलाओ' form
  # leaves reminder_time empty on the deployed model (2026-09-08 probe).
  # ------------------------------------------------------------------------
  - utterance: "तीस मिनट में मुझे याद दिलाओ"
    expected_intent: SetReminderIntent
    expected_slots:
      reminder_duration: {}

  - utterance: "आठ बजे का रिमाइंडर सेट करो"
    expected_intent: SetReminderIntent
    expected_slots:
      reminder_time: {}

  # ------------------------------------------------------------------------
  # JF-399 English-inertia resolution (2026-09-12): FindSong/FindSongByArtist/
  # PlayBook translated to Hindi; probe-verified. PlayBook divergence: the
  # slotless opener routes, but carriers with a real title are stolen by
  # PlayArtistSongsIntent (JF-406 class).
  # ------------------------------------------------------------------------
  - utterance: "गाना खोजो"
    expected_intent: FindSongIntent
    expected_slots: {}

  - utterance: "ऑडियोबुक सुनो"
    expected_intent: PlayBookIntent
    expected_slots: {}

  # ------------------------------------------------------------------------
  # JF-399 PlayPlaylist/PlayArtistSongs parity pass (2026-09-27): the
  # meri-playlist-lagaao and ke-gaane-bajao carrier families. Requires
  # the model deploy; the first live suite run after it is the probe.
  # ------------------------------------------------------------------------
  - utterance: "मेरी प्लेलिस्ट पसंदीदा लगाओ"
    expected_intent: PlayPlaylistIntent
    expected_slots:
      playlist: {}

  - utterance: "queen के गाने बजाओ"
    expected_intent: PlayArtistSongsIntent
    expected_slots:
      musician: {}

  # ------------------------------------------------------------------------
  # JF-766 (2026-10-05): the PlayVideo bare '{title} देखो' thief is removed
  # (hi-IN twin of the ja JF-761 removal; see the template's PlayVideoIntent
  # comment). The exact-value series_name pin below is the anti-pollution
  # regression pin: red until the rebuilt hi-IN model deploys. The pin value
  # is the RAW slot value 'game of thrones', NOT the canonical committed-type
  # 'Game of Thrones': the suite's exact-value comparison runs against
  # slot.value, and the hi-IN probes returned the spoken raw text (the ja
  # JF-761 pin now carries the same raw value, corrected by JF-769; the ER
  # status behind the surface is unresolved there, the raw reading is the
  # observed fact). After the deploy, a red value row means slot drift OR a
  # surface flip: re-probe to distinguish before editing the pin (the ja
  # twin comment carries the full conflict record).
  # ------------------------------------------------------------------------
  - utterance: "game of thrones सीज़न 1 एपिसोड 3 देखो"
    expected_intent: PlayEpisodeIntent
    expected_slots:
      series_name:
        value: "game of thrones"
      season_number: {}
      episode_number: {}
