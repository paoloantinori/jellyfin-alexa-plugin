locale: hi-IN
invocation_name: jellyfin player
tests:
  # JF-400: hi-IN had no NLU fixture file; seeded (probe-verified 2026-08-29 against the
  # live model) with the JF-414 indefinite album-by-artist forms. Both route to
  # PlayAlbumIntent with the raw musician value preserved. Extend per the JF-400 program.
  - utterance: "queen का एल्बम चलाओ"
    expected_intent: PlayAlbumIntent
    expected_slots:
      musician: {}

  - utterance: "queen का एल्बम सुनो"
    expected_intent: PlayAlbumIntent
    expected_slots:
      musician: {}

  # ------------------------------------------------------------------------
  # SetReminderIntent (duration_minutes / reminder_time), JF-451/JF-400
  # Probe-verified live 2026-09-08. The '{reminder_time} का रिमाइंडर सेट करो'
  # sample form fills the slot; the '{reminder_time} पर मुझे याद दिलाओ' form
  # leaves reminder_time empty on the deployed model (2026-09-08 probe).
  # ------------------------------------------------------------------------
  - utterance: "तीस मिनट में मुझे याद दिलाओ"
    expected_intent: SetReminderIntent
    expected_slots:
      duration_minutes: {}

  - utterance: "आठ बजे का रिमाइंडर सेट करो"
    expected_intent: SetReminderIntent
    expected_slots:
      reminder_time: {}

  # ------------------------------------------------------------------------
  # JF-399 English-inertia resolution (2026-09-12): FindSong/FindSongByArtist/
  # PlayBook translated to Hindi; probe-verified. PlayBook divergence: the
  # slotless opener routes, but carriers with a real title are stolen by
  # PlayArtistSongsIntent (JF-406 class).
  # ------------------------------------------------------------------------
  - utterance: "गाना खोजो"
    expected_intent: FindSongIntent
    expected_slots: {}

  - utterance: "ऑडियोबुक सुनो"
    expected_intent: PlayBookIntent
    expected_slots: {}
