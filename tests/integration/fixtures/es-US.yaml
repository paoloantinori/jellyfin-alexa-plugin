locale: es-US
invocation_name: jellyfin player
tests:
  # JF-414: es-US had no NLU fixture file at all while its siblings es-ES and es-MX
  # did (review finding 2026-08-29); seeded with the indefinite album-by-artist form
  # that motivated the model change, plus one routing sanity entry. Extend per JF-400.
  - utterance: "un álbum de queen"
    expected_intent: PlayAlbumIntent
    expected_slots:
      musician: {}

  # NOTE (JF-406 divergence class, observed 2026-08-29): on es-US the imperative
  # "Reproduce un álbum de queen" routes to PlaySongIntent (song='1 album') while
  # the identical utterance shape works on es-ES/es-MX - per-locale NLU divergence
  # with identical models. Only the bare form is asserted here; the divergence is
  # tracked in JF-406.
  #
  # JF-406 systematic re-probe (profile-nlu, 2026-09-15, post RepeatIntent model
  # rebuild; each cell re-probed 3x, stable). es-US diverges from the es-ES truth
  # on four families, all with byte-identical samples in the committed models, so
  # the arbitration is Amazon per-locale base-model, not our model:
  #   "Reproduce el álbum thriller de michael jackson" -> PlaySongIntent
  #     (song='el album thriller michael jackson')  [es-ES/es-MX: PlayAlbumIntent]
  #   "Reproduce un álbum de queen" -> PlaySongIntent (song='1 album')
  #   "Ir al capítulo cinco" -> PlaySongIntent (song='al capitulo 5')
  #     [es-ES/es-MX: GoToChapterIntent chapter_number=5]
  #   "reproduce música alegre" -> PlaySongIntent (song='musica alegre')
  #     [es-ES/es-MX: PlayMoodMusicIntent mood=alegre]
  # 'muéstrame álbumes' -> AMAZON.FallbackIntent on BOTH es-US and es-MX
  # (BrowseLibraryIntent on es-ES); the es-US model legitimately lacks the three
  # leading browse samples es-ES/es-MX carry (template header, JF-316 golden
  # master), but es-MX fails with the full sample set, so the missing samples are
  # not the cause. No sample tuning is attempted: the failing carriers are
  # verbatim model samples already, so only live verification (next deploy
  # window) could prove a sample addition. Do not assert the divergent utterances
  # here; this fixture ships only verified-working expectations.

  # Routing sanity: a browse phrase must not be stolen by the new album forms
  # (matches the model's own sample "explorar {browse_category}").
  - utterance: "explorar álbumes"
    expected_intent: BrowseLibraryIntent
    expected_slots:
      browse_category: {}

  # JF-551 (2026-10-04): this locale's first PlayEpisode entries, pinning the
  # SUBJUNCTIVE wrapper payload ("pide a {inv} que reproduzca ...", series
  # FIRST). Pre-family evidence on es-US: the BARE form selected
  # PlayEpisodeIntent but DROPPED series_name entirely, while the
  # connector-residue form glued "que reproduzca breaking bad" into the slot;
  # the exact-value pin is the anti-pollution regression pin and stays red
  # until the rebuilt model with the "reproduzca" family is deployed. The
  # number slots are pinned because every subjunctive reading on es-US filled
  # both consistently. The imperative episode forms are deliberately NOT
  # pinned: their probes on es-US filled slots inconsistently (JF-406
  # divergence class).
  - utterance: "reproduzca breaking bad temporada uno episodio tres"
    expected_intent: PlayEpisodeIntent
    expected_slots:
      series_name:
        value: "breaking bad"
      season_number: {}
      episode_number: {}

  # JF-844 densification pin (2026-10-09): the STOLEN SHAPE class that
  # motivated the season-ed family's densification in all three es locales
  # (see the es-ES template header for the live steal evidence). Mirrors
  # es-ES's series-first pin with both numbers presence-pinned (the
  # murderbot class, see the es-ES fixture). CAVEAT: if the numbers read
  # inconsistently after the roll (the JF-406 class, see the JF-551 note
  # above), apply this locale's imperative-not-pinned convention
  # (skip_reason with the probe evidence), never a silent weakening. Red
  # until the roll.
  - utterance: "reproduce breaking bad temporada uno episodio tres"
    expected_intent: PlayEpisodeIntent
    expected_slots:
      series_name:
        value: "breaking bad"
      season_number: {}
      episode_number: {}

  # =========================================================================
  # JF-399 item b (2026-10-11, maintainer decision: SPANISH): FindSong /
  # FindSongByArtist now carry es-ES's Spanish sets (byte-equal to
  # es-ES/es-MX; templates/es-US.yaml). The rows below pin the
  # probe-verified readings (profile-nlu, post SMAPI deploy 2026-10-11,
  # 2/2 each). Like the JF-399 item a pins on en-US, these went
  # red-then-green the same evening: green on the first live run after
  # this commit, red if a later rebuild reverts the embedded model.
  # =========================================================================
  # Baseline recoveries (pre-swap the Spanish openers fell to
  # AMAZON.FallbackIntent, misrouted to QueryArtistLibraryIntent with an
  # empty query_type, or glued the whole phrase into PlaySong's song slot,
  # e.g. song='1 cancion llamada purple rain').
  - utterance: "busca una cancion"
    expected_intent: FindSongIntent
    expected_slots: {}

  - utterance: "quiero encontrar una cancion"
    expected_intent: FindSongIntent
    expected_slots: {}

  - utterance: "busca una cancion de queen"
    expected_intent: FindSongByArtistIntent
    expected_slots:
      musician: {}

  # Slot-value pin (JF-766 convention): profile-nlu returns the RAW spoken
  # text, so the pin is the raw 'purple rain'.
  - utterance: "busca una cancion llamada purple rain"
    expected_intent: FindSongIntent
    expected_slots:
      titleKeywords:
        value: "purple rain"

  - utterance: "busca un tema de michael jackson"
    expected_intent: FindSongByArtistIntent
    expected_slots:
      musician: {}

  - utterance: "estoy buscando una cancion"
    expected_intent: FindSongIntent
    expected_slots: {}

  # -------------------------------------------------------------------------
  # THE ACCEPTED TRADE (recorded, not asserted): the removed English
  # FindSong forms. Probed 2026-10-11 post-swap, 2/2 each:
  #   "find a song"                     -> NO_SELECTION (was FindSongIntent)
  #   "search for a song"               -> NO_SELECTION (was FindSongIntent)
  #   "find a song called purple rain"  -> PlaySongIntent, song=<whole
  #                                        phrase> glued (was FindSongIntent,
  #                                        titleKeywords=purple rain)
  #   "find a song by queen"            -> PlaySongIntent glued (was
  #                                        FindSongByArtistIntent, musician=queen)
  #   "I'm looking for a song"          -> PlaySongIntent glued (was FindSongIntent)
  # The maintainer's SPANISH decision accepts this loss for the es-US
  # marketplace; English-speakers on es-US are served by en-US. These are
  # RECORDS, not guards: the runner skips them without probing, so a
  # future flip on these utterances is silent here; the live Spanish rows
  # above are the regression tripwire for the swap.
  # -------------------------------------------------------------------------
  - utterance: "find a song"
    expected_intent: AMAZON.FallbackIntent
    skip_reason: "English-loss record, JF-399 item b accepted trade: reads NO_SELECTION 2/2 post-swap (was FindSongIntent); no fixture shape expresses a no-selection expectation"

  - utterance: "find a song called purple rain"
    expected_intent: PlaySongIntent
    skip_reason: "English-loss record, JF-399 item b accepted trade: reads PlaySongIntent with the whole phrase glued into song (was FindSongIntent titleKeywords=purple rain); not asserted to avoid pinning a glued fill"

  - utterance: "find a song by queen"
    expected_intent: PlaySongIntent
    skip_reason: "English-loss record, JF-399 item b accepted trade: reads PlaySongIntent glued (was FindSongByArtistIntent musician=queen); not asserted to avoid pinning a glued fill"

  - utterance: "search for a song"
    expected_intent: AMAZON.FallbackIntent
    skip_reason: "English-loss record, JF-399 item b accepted trade: reads NO_SELECTION 2/2 post-swap (was FindSongIntent); no fixture shape expresses a no-selection expectation"

  - utterance: "I'm looking for a song"
    expected_intent: PlaySongIntent
    skip_reason: "English-loss record, JF-399 item b accepted trade: reads PlaySongIntent with 'looking for a song' glued into song (was FindSongIntent); not asserted to avoid pinning a glued fill"
  # -------------------------------------------------------------------------
  # SkipForwardBackIntent (JF-875 rollout; "salta adelante" was the JF-684
  # no-selection class before). The avanza/retrocede verb-direction synonyms
  # ride the bare row (the rewind-as-synonym mechanism). Verified on the
  # scratch build across two identical-content rebuilds.
  # -------------------------------------------------------------------------
  - utterance: "salta adelante 30 segundos"
    expected_intent: SkipForwardBackIntent
    expected_slots:
      seek_direction: {}
      seek_amount: {}
      seek_unit: {}

  - utterance: "retrocede 30 segundos"
    expected_intent: SkipForwardBackIntent
    expected_slots:
      seek_direction: {}
      seek_amount: {}
      seek_unit: {}

  # NOTE (JF-875, stable across two identical-content scratch rebuilds): the
  # "salta atrás {n}" combination leaves seek_direction UNFILLED on this
  # locale's trainer (es-ES/es-MX bind it green), so it is deliberately NOT
  # pinned; "retrocede {n} segundos" above is the reliable back carrier here.
  # Transport steal guard (pre-existing vendor routing).
  - utterance: "siguiente canción"
    expected_intent: ShowMoreIntent
    expected_slots: {}

  # -----------------------------------------------------------------------
  # LoopAllOnIntent (no slots) - JF-904 queue-scoped carriers
  # (rationale: the loop constants in IntentNames). RED-UNTIL-DEPLOY
  # until the 13-locale model rebuild (the JF-766 convention).
  # -----------------------------------------------------------------------

  # The loop-region boundary pin (A|B alternation, the JF-902
  # convention): LoopAllOnIntent now competes in this locale's
  # loop region, so either repeat-one delivery is correct and a
  # LoopAllOnIntent delivery must fail the pin.
  - utterance: "Repite esta canción"
    expected_intent: LoopSongOnIntent|AMAZON.LoopOnIntent
    expected_slots: {}

  - utterance: "Repite la cola"
    expected_intent: LoopAllOnIntent
    expected_slots: {}

  - utterance: "repita la cola"
    expected_intent: LoopAllOnIntent
    expected_slots: {}
