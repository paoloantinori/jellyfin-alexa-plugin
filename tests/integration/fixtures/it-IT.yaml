  # -------------------------------------------------------------------------
  # 30. c'e patterns (is-there patterns)
  # These test the c'e utterances added to intent-specific samples.
  # NLU should prefer typed-slot intents over SearchMediaIntent for
  # music-related c'e queries, and route generic ones to SearchMediaIntent.
  # -------------------------------------------------------------------------
  - utterance: "c'e una canzone di radiohead"
    expected_intent: FindSongByArtistIntent
    expected_slots:
      musician: {}

  # JF-441: routing guard for "c'e un album chiamato {album}" (the
  # album-specific pattern must win over PlayArtistSongsIntent; observed
  # flipping there on 2026-09-01). Intent-level only: the album slot fill for
  # a title NOT in the AlbumName catalog is Amazon-statistical. "dark side of
  # the moon" is absent from the live catalog (886 values, v511), so the
  # catalog-backed album slot cannot anchor it and the free-text musician slot
  # on the same intent absorbs the span (verified 2026-09-03: album empty,
  # musician="dark side of the moon", deterministic 3/3). In-catalog titles
  # fill cleanly on this exact shape ("c'e un album chiamato surfer rosa" ->
  # album ER_SUCCESS_MATCH). Do not re-add a slot expectation while the title
  # is out-of-catalog; the handler degrades gracefully (NotFoundAlbumByArtist).
  - utterance: "c'e un album chiamato dark side of the moon"
    expected_intent: PlayAlbumIntent
    expected_slots: {}

  # JF-490: the 'che si chiama' carrier, device-evidenced (corr=7446fba8,
  # 2026-09-04: matched NO intent on-device, FallbackIntent, and the bare
  # retry was captured by Amazon Music). The template now carries
  # "un album che si chiama {album}" / "un disco che si chiama {album}".
  # Intent-level only: the fill is Amazon-statistical and drifts across
  # rebuilds (on 2026-09-04 even the JF-441 shape "un album chiamato surfer
  # rosa" flipped to musician="chiamato surfer rosa", deterministic 2/2);
  # the handler-side calling-word strips are the fill coverage.
  - utterance: "un album che si chiama surfer rosa"
    expected_intent: PlayAlbumIntent
    expected_slots: {}

  # JF-490: the cerca+chiamato PLAY shape, device-evidenced (corr=f919db65,
  # 2026-09-04: a play request the statistical router already sends to
  # PlayAlbumIntent with the span stolen by musician). The new sample anchors
  # the fill; the musician-theft recovery is JF-489's handler fix.
  - utterance: "cerca un album chiamato surfer rosa"
    expected_intent: PlayAlbumIntent
    expected_slots: {}

  # "c'e un film che si chiama matrix" hits FallbackIntent — the NLU can't match
  # it to any intent reliably. SearchMediaIntent's "c'è {query}" pattern isn't
  # strong enough. Accept FallbackIntent; users should use "Cerca matrix" instead.
  - utterance: "c'e un film che si chiama matrix"
    expected_intent: AMAZON.FallbackIntent
    expected_slots: {}

