  # ("suona {song} dopo" matches more strongly). Use song_noun carrier for reliability.
  - utterance: "Suona il brano bohemian rhapsody"
    expected_intent: PlaySongIntent
    expected_slots:
      song: {}

  # "Metti hotel california" — NLU can't select an intent (competition between
  # PlaySongIntent, PlayVideoIntent, PlayArtistSongsIntent). Use explicit forms
  # like "Metti il brano hotel california" for reliable routing.

  - utterance: "Ascolta stairway to heaven"
    expected_intent: PlaySongIntent
    expected_slots:
      song: {}

  # "Riproduci yesterday" is ambiguous (NLU: no selectedIntent, considered MediaInfo/PlaySong/Recommend/SleepTimer/BrowseLibrary)
  # Short single-word song names cannot be reliably resolved; use explicit forms like "Riproduci il brano yesterday"

  - utterance: "Fai partire Comfortably Numb"
    expected_intent: PlaySongIntent
    expected_slots:
      song: {}

  # -------------------------------------------------------------------------
  # 24. PlayAlbumIntent (album, musician)
  # -------------------------------------------------------------------------
  # JF-470 (2026-09-03): 'Riproduci album {album}' is a VERBATIM PlayAlbum
  # sample, yet for this title the NLU selects PlayArtistSongsIntent with
  # musician absorbing the span (consideredIntents[0] is PlayAlbumIntent while
  # the selection lands elsewhere: the JF-441/JF-469 entity-weighting family,
  # Amazon-side). Title-statistics dependent, not purely catalog membership:
  # 'thriller' keeps PlayAlbumIntent (companion entry below) while in-catalog
  # 'surfer rosa' loses the same way (both probed 3/3). Pin updated to the
  # verified routing; a future flip re-flags here.
  - utterance: "Riproduci album dark side of the moon"
    expected_intent: PlayArtistSongsIntent
    expected_slots:
      musician: {}

  # JF-470 companion guard: the album-noun carrier itself must keep working
  # when the title is anchored by the STATIC AlbumName model seed (thriller is
  # NOT in the Jellyfin library, so the library-synced catalog does not carry
  # it; the ER match comes from the seed values). Probe-verified 3/3.
  - utterance: "Riproduci album thriller"
    expected_intent: PlayAlbumIntent
    expected_slots:
      album: {}

  - utterance: "Suona album thriller di michael jackson"
    expected_intent: PlayAlbumIntent
    expected_slots:
      album: {}
      musician: {}

  # "Di suonare" prefix patterns (invocation-prefix form)
  # NOTE: "Di suonare album abbey road" is ambiguous with PlayVideoIntent ("Di suonare {title}").
  # Even "Di suonare l'album abbey road" fails — NLU prefers the generic {title} slot.
  # Use "Fai suonare l'album {album}" instead: PlayVideoIntent has no "Fai suonare" pattern.
  - utterance: "Fai suonare l'album abbey road"
    expected_intent: PlayAlbumIntent
    expected_slots:
      album: {}

  - utterance: "Di suonare disco thriller"
    expected_intent: PlayAlbumIntent
    expected_slots:
      album: {}

  # Article-bearing album forms — what Italian users actually say
  # ("mettere l'album / il disco X"). Before the album_noun article fix these
  # routed to PlaySongIntent / no-selection (jazz cafe case, 2026-07-12).
  - utterance: "Di mettere l'album abbey road"
    expected_intent: PlayAlbumIntent
    expected_slots:
      album: {}

  - utterance: "Metti il disco thriller"
    expected_intent: PlayAlbumIntent
    expected_slots:
      album: {}

  - utterance: "Suona l'album dark side of the moon"
    expected_intent: PlayAlbumIntent
    expected_slots:
      album: {}

  - utterance: "Di mettere il disco rumours"
    expected_intent: PlayAlbumIntent
    expected_slots:
      album: {}

  # JF-411: indefinite album-by-artist forms. Before these samples existed,
  # "un disco dei <artist>" routed to AMAZON.FallbackIntent (profile-nlu winner
  # with PlayAlbum/PlayArtistSongs only "considered"), which on-device cascaded
  # into Fallback "Non ho capito" and a RecommendIntent misroute (2026-08-28).
  - utterance: "un disco dei queen"
    expected_intent: PlayAlbumIntent
    expected_slots:
      musician: {}

  - utterance: "un album di michael jackson"
    expected_intent: PlayAlbumIntent
    expected_slots:
      musician: {}

  - utterance: "Suona un disco dei queen"
    expected_intent: PlayAlbumIntent
    expected_slots:
      musician: {}

  - utterance: "Metti un album di michael jackson"
    expected_intent: PlayAlbumIntent
    expected_slots:
      musician: {}

  # JF-411 hardening: desiderative forms (previously bled the whole phrase into the
  # musician slot) and carrier-anchored forms (fill anchors for on-device NLU).
  - utterance: "vorrei un disco dei queen"
    expected_intent: PlayAlbumIntent
    expected_slots:
      musician: {}

  - utterance: "vorrei ascoltare un album di michael jackson"
    expected_intent: PlayAlbumIntent
    expected_slots:
