    expected_intent: RepeatSingleOnIntent
    expected_slots: {}

  - utterance: "Ripeti il brano"
    expected_intent: RepeatSingleOnIntent
    expected_slots: {}

  # JF-438: "ripetila" replaces the removed "Suonala ancora" (which collided
  # with "Suona la ..." artist forms); the Ripeti-family must stay routable.
  - utterance: "ripetila"
    expected_intent: RepeatSingleOnIntent
    expected_slots: {}

  - utterance: "ripeti ancora"
    expected_intent: RepeatSingleOnIntent
    expected_slots: {}

  # JF-439: the coin-flip state of the musician-shaped title region. Pins the
  # CURRENT routing so a future model edit that re-flips it flags here for
  # triage; the handler fallback serves the song either way (unit-proven in
  # PlayArtistSongsIntentHandlerTests).
  # JF-470 (2026-09-03): the coin flipped AGAIN, now to PlaySongIntent with the
  # literal 'canzone' bleeding into the song slot ('canzone sugar free jazz').
  # Probe-verified 3/3 deterministic against the live model (catalogs AlbumName
  # v523 / JellyfinArtist v517). No repo commit in the 09-01..09-03 window
  # touched this carrier region (JF-438 removed only RepeatSingle Suona+clitic
  # samples; JF-450/451 added SetReminderIntent): Amazon-side statistical shift.
  - utterance: "suona la canzone sugar free jazz"
    expected_intent: PlaySongIntent
    expected_slots:
      song: {}

  # -------------------------------------------------------------------------
  # 4. PlayChannelIntent (channel)
  # -------------------------------------------------------------------------
  - utterance: "Canale radio maria"
    expected_intent: PlayChannelIntent
    expected_slots:
      channel: {}

  - utterance: "Riproduci radio rtl"
    expected_intent: PlayChannelIntent
    expected_slots:
      channel: {}

  # -------------------------------------------------------------------------
  # 5. PlayVideoIntent (title)
  # Note: PlayVideoIntent is dominated by PlaySongIntent (6 vs 64 samples).
  # "verb + title" patterns used to resolve to PlaySongIntent, which was fine
  # since the skill handler determines content type from Jellyfin search.
  # JF-470 (2026-09-03): bare 'Riproduci/suona star wars' now selects
  # PlayNextIntent (song slot filled): Amazon's NLU matches the PlayNext
  # 'riproduci {song} dopo' / 'suona {song} dopo' family with the trailing
  # 'dopo' dropped. PlaySong has NO bare 'Riproduci {song}' sample (only
  # song_noun carriers), so nothing was removed to cause this; the same class
  # is documented at 'Suona bohemian rhapsody' in section 23. Probe-verified
  # 3/3 deterministic. UX cost: enqueue-as-next instead of play-now; adding a
  # bare song carrier would recreate the JF-418 collision family, so the pin
  # documents reality rather than endorsing it.
  # -------------------------------------------------------------------------
  - utterance: "Riproduci star wars"
    expected_intent: PlayNextIntent
    expected_slots:
      song: {}

  - utterance: "voglio guardare star wars"
    expected_intent: PlayVideoIntent
    expected_slots:
      title: {}

  - utterance: "fai vedere matrix"
    expected_intent: PlayVideoIntent
    expected_slots:
      title: {}

  # JF-436: video-regression direction of the JF-418 bare-form collision.
  # PlayArtistSongsIntent's bare '{imperative} {musician}' samples (JF-418)
  # collide in surface shape with PlayVideoIntent's '{imperative} {title}' on
  # 4 of 5 imperative verbs. Live profile-nlu probes (2026-09-01, 14 bare
  # movie/series utterances) show PlayVideoIntent is NEVER selected on the
  # Suona/Metti/Pleia verbs:
  #   'suona/metti/pleia matrix'        -> PlayArtistSongsIntent, musician='matrix'
  #   'suona/metti/pleia pulp fiction'  -> PlayArtistSongsIntent, musician='pulp fiction'
  #   'suona/metti/pleia star wars'     -> PlaySongIntent, song='star wars' (the
  #                                        pre-JF-418 documented class; the handler
  #                                        resolves content type from Jellyfin search).
  #                                        JF-470 (2026-09-03): 'suona star wars'
  #                                        shifted to PlayNextIntent (the
  #                                        '{song} dopo' statistical steal, same
  #                                        class as 'Riproduci star wars' above);
  #                                        pin updated below, 3/3 deterministic.
  #   'suona/metti/pleia breaking bad', 'suona stranger things' -> no selectedIntent
  #                                        (SeriesName catalog resolution pulls
  #                                        PlayEpisodeIntent into the competition)
  #   'suona inception'                 -> PlayRadioIntent, no slots
  # The pins below record the CURRENT routing so a future model edit that flips
  # any of them (in either direction, including restoring PlayVideoIntent) flags
  # here for triage. Per JF-436 scope the interaction model is NOT changed here;
  # the fixtures pin reality, they do not endorse it.
  - utterance: "suona matrix"
    expected_intent: PlayArtistSongsIntent
    expected_slots:
      musician: {}

  - utterance: "metti pulp fiction"
    expected_intent: PlayArtistSongsIntent
    expected_slots:
      musician: {}

  - utterance: "pleia matrix"
    expected_intent: PlayArtistSongsIntent
    expected_slots:
      musician: {}

  # JF-470 (2026-09-03): PlayNextIntent steal ('suona {song} dopo' family,
  # trailing word dropped by Amazon's matcher); probe-verified 3/3.
  - utterance: "suona star wars"
    expected_intent: PlayNextIntent
    expected_slots:
      song: {}

