locale: nl-NL
invocation_name: jellyfin player
tests:
  # JF-400: nl-NL had no NLU fixture file; seeded (probe-verified 2026-08-29 against the
  # live model) with the JF-414 indefinite album-by-artist forms. All three route to
  # PlayAlbumIntent with the raw musician value preserved. Extend per the JF-400 program.
  - utterance: "een album van queen"
    expected_intent: PlayAlbumIntent
    expected_slots:
      musician: {}

  - utterance: "speel een album van queen"
    expected_intent: PlayAlbumIntent
    expected_slots:
      musician: {}

  - utterance: "luister naar een album van queen"
    expected_intent: PlayAlbumIntent
    expected_slots:
      musician: {}

  # ------------------------------------------------------------------------
  # SetReminderIntent (reminder_duration / reminder_time), JF-451/JF-622
  # Probe-verified live 2026-09-08 (both slots fill).
  # ------------------------------------------------------------------------
  - utterance: "herinner me over dertig minuten"
    expected_intent: SetReminderIntent
    expected_slots:
      reminder_duration: {}

  - utterance: "herinner me om acht uur"
    expected_intent: SetReminderIntent
    expected_slots:
      reminder_time: {}

  # ------------------------------------------------------------------------
  # JF-399 English-inertia resolution (2026-09-12): FindSong/FindSongByArtist/
  # PlayBook translated to Dutch; probe-verified before asserting.
  # ------------------------------------------------------------------------
  - utterance: "vind een nummer"
    expected_intent: FindSongIntent
    expected_slots: {}

  - utterance: "vind een nummer genaamd imagining"
    expected_intent: FindSongIntent
    expected_slots:
      titleKeywords: {}

  - utterance: "vind een nummer van queen"
    expected_intent: FindSongByArtistIntent
    expected_slots:
      musician: {}

  # JF-399 FindSongByArtist parity pass (2026-09-26): the ik-wil carrier
  # family. Requires the model deploy; the first live suite run after it is
  # the probe.
  - utterance: "ik wil een nummer van queen vinden"
    expected_intent: FindSongByArtistIntent
    expected_slots:
      musician: {}

  - utterance: "luister naar luisterboek een kunstenaar"
    expected_intent: PlayBookIntent
    expected_slots: {}
    # DIVERGENCE (documented, JF-406 class): the speel-form PlayBook carrier
    # ('speel het luisterboek X') is stolen by PlayArtistSongsIntent with a
    # garbage musician capture; only the luister-naar carrier routes.

# --- JF-864 (2026-10-11): the nl-NL radio guard pins ---
# The bare 'speel radio' statics were article-qualified after the 16-locale
# crossing probes found nl-NL the ONE sibling with it-IT's device-confirmed
# steal ('speel nemo' -> PlayRadioIntent, live). Post-fix (live 3/3): the
# steal is dead (speel nemo -> NO_SELECTION) and the qualified forms hold.
  - utterance: "speel de radio"
    expected_intent: PlayRadioIntent
    expected_slots: {}
  # -------------------------------------------------------------------------
  # SkipForwardBackIntent (JF-875 rollout). Dutch mirrors German: the
  # direction particle rides the row tail. Word-form numbers are pinned
  # because this locale's profile-nlu fails DIGIT delivery into
  # AMAZON.NUMBER slots (a pre-existing quirk: the vendor model's own
  # "ga naar hoofdstuk 3" shows chapter_number ABSENT). Verified on the
  # scratch build across two identical-content rebuilds.
  # -------------------------------------------------------------------------
  - utterance: "spring dertig seconden vooruit"
    expected_intent: SkipForwardBackIntent
    expected_slots:
      seek_direction: {}
      seek_amount: {}
      seek_unit: {}

  - utterance: "ga dertig seconden terug"
    expected_intent: SkipForwardBackIntent
    expected_slots:
      seek_direction: {}
      seek_amount: {}
      seek_unit: {}

  # Transport steal guard (pre-existing vendor routing).
  - utterance: "volgende nummer"
    expected_intent: ShowMoreIntent
    expected_slots: {}
