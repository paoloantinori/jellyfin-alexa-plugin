locale: nl-NL
invocation_name: jellyfin player
tests:
  # JF-400: nl-NL had no NLU fixture file; seeded (probe-verified 2026-08-29 against the
  # live model) with the JF-414 indefinite album-by-artist forms. All three route to
  # PlayAlbumIntent with the raw musician value preserved. Extend per the JF-400 program.
  - utterance: "een album van queen"
    expected_intent: PlayAlbumIntent
    expected_slots:
      musician: {}

  - utterance: "speel een album van queen"
    expected_intent: PlayAlbumIntent
    expected_slots:
      musician: {}

  - utterance: "luister naar een album van queen"
    expected_intent: PlayAlbumIntent
    expected_slots:
      musician: {}

  # ------------------------------------------------------------------------
  # SetReminderIntent (duration_minutes / reminder_time), JF-451/JF-400
  # Probe-verified live 2026-09-08 (both slots fill).
  # ------------------------------------------------------------------------
  - utterance: "herinner me over dertig minuten"
    expected_intent: SetReminderIntent
    expected_slots:
      duration_minutes: {}

  - utterance: "herinner me om acht uur"
    expected_intent: SetReminderIntent
    expected_slots:
      reminder_time: {}

  # ------------------------------------------------------------------------
  # JF-399 English-inertia resolution (2026-09-12): FindSong/FindSongByArtist/
  # PlayBook translated to Dutch; probe-verified before asserting.
  # ------------------------------------------------------------------------
  - utterance: "vind een nummer"
    expected_intent: FindSongIntent
    expected_slots: {}

  - utterance: "vind een nummer genaamd imagining"
    expected_intent: FindSongIntent
    expected_slots:
      titleKeywords: {}

  - utterance: "vind een nummer van queen"
    expected_intent: FindSongByArtistIntent
    expected_slots:
      musician: {}

  - utterance: "luister naar luisterboek een kunstenaar"
    expected_intent: PlayBookIntent
    expected_slots: {}
    # DIVERGENCE (documented, JF-406 class): the speel-form PlayBook carrier
    # ('speel het luisterboek X') is stolen by PlayArtistSongsIntent with a
    # garbage musician capture; only the luister-naar carrier routes.
