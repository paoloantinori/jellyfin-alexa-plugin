  - utterance: "demande à mon serveur de sauter en arrière"
    expected_intent: SkipForwardBackIntent
    expected_slots:
      seek_direction: {}

  - utterance: "demande à mon serveur de sauter en avant de trente secondes"
    expected_intent: SkipForwardBackIntent
    expected_slots:
      seek_direction: {}
      seek_amount: {}
      seek_unit: {}

