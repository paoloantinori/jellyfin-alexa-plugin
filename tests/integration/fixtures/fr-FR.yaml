  # JF-907 wrapper-tail pin (the JF-900 fallback composes 'de mettre le
  # film X' from the smoke fixture's 'mets le film X'). RED-UNTIL-DEPLOY:
  # reads AMAZON.FallbackIntent on the saved model today.
  - utterance: "De mettre le film barbie"
    expected_intent: PlayVideoIntent
    expected_slots:
      title: {}

  # -------------------------------------------------------------------------
  # 8. PlayArtistSongsIntent (musician)
  # -------------------------------------------------------------------------
  - utterance: "Lis les chansons de queen"
    expected_intent: PlayArtistSongsIntent
    expected_slots:
      musician: {}

  # JF-907 wrapper-tail pins (the JF-900 fallback composes 'de lire les
  # chansons de X'). Bare-tail state on the saved model: the pink row routes
  # today via generalization, the xyzzyfoo row is RED-UNTIL-DEPLOY on this
  # locale (QueryArtistLibraryIntent steal). The full composed one-shot
  # ('demande à mon serveur de lire les chansons de X') is the stolen shape
  # in BOTH fr locales (profile-nlu, 3/3 stable) - that is the shape the
  # JF-907 row exists to win; these pins guard the row itself.
  - utterance: "De lire les chansons de pink floyd"
    expected_intent: PlayArtistSongsIntent
    expected_slots:
      musician: {}

  - utterance: "De lire les chansons de xyzzyfoo"
    expected_intent: PlayArtistSongsIntent
    expected_slots:
      musician: {}

  # NLU routes "Lis la musique de the beatles" to PlaySongIntent because
  # PlaySongIntent's "Lis {song}" pattern greedily captures everything after "Lis".
  # PlayArtistSongsIntent has "Lis la musique de {musician}" but can't win the
  # disambiguation against 21 "Lis"-prefixed PlaySongIntent samples.
  - utterance: "Lis la musique de the beatles"
    expected_intent: PlaySongIntent
    expected_slots:
      song: {}

