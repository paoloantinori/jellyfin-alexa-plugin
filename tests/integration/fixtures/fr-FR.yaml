  # the scratch build across two identical-content rebuilds.
  # -------------------------------------------------------------------------
  - utterance: "avance de 30 secondes"
    expected_intent: SkipForwardBackIntent
    expected_slots:
      seek_direction: {}
      seek_amount: {}
      seek_unit: {}

  - utterance: "recule de 30 secondes"
    expected_intent: SkipForwardBackIntent
    expected_slots:
      seek_direction: {}
      seek_amount: {}
      seek_unit: {}

  - utterance: "saute en arrière de 30 secondes"
