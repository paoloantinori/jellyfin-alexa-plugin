locale: fr-FR
invocation_name: mon serveur
tests:
  # -------------------------------------------------------------------------
  # 1. LoopAllOffIntent (no slots)
  # -------------------------------------------------------------------------
  - utterance: "Désactive la boucle"
    expected_intent: LoopAllOffIntent
    expected_slots: {}

  - utterance: "Désactive la répétition"
    expected_intent: LoopAllOffIntent
    expected_slots: {}

  # -------------------------------------------------------------------------
  # 2. LoopAllOnIntent (no slots) - queue-scoped wording only since JF-902
  # -------------------------------------------------------------------------
  # JF-902: the bare loop-activation rows ('Active la boucle'/'Active la
  # répétition') moved to LoopSongOnIntent (2b below; JF-901 settled that
  # bare loop activation means repeat-ONE); this intent's pins are the
  # queue-naming family. RED-UNTIL-DEPLOY rows (the JF-766 convention):
  # green on the live suite only after the rebuilt model deploys.
  - utterance: "Répète la file d'attente"
    expected_intent: LoopAllOnIntent
    expected_slots: {}

  - utterance: "Répète toute la file d'attente"
    expected_intent: LoopAllOnIntent
    expected_slots: {}

  - utterance: "Mets la file d'attente en boucle"
    expected_intent: LoopAllOnIntent
    expected_slots: {}

  - utterance: "De répéter la file d'attente"
    expected_intent: LoopAllOnIntent
    expected_slots: {}

  # -------------------------------------------------------------------------
  # 2b. LoopSongOnIntent (no slots) - the bare loop-activation family
  # -------------------------------------------------------------------------
  # JF-902: rows MOVED from LoopAllOnIntent (not dropped: without an exact
  # row the local loop words have no reliable router claim, the same
  # built-in gap the fr shuffle probes documented live 2026-09-23).
  # RED-UNTIL-DEPLOY: they read LoopAllOnIntent on the saved model today.
  - utterance: "Active la boucle"
    expected_intent: LoopSongOnIntent|AMAZON.LoopOnIntent
    expected_slots: {}

  - utterance: "Active la répétition"
    expected_intent: LoopSongOnIntent|AMAZON.LoopOnIntent
    expected_slots: {}

  # -------------------------------------------------------------------------
  # 3. RepeatSingleOnIntent (no slots)
  # -------------------------------------------------------------------------
  - utterance: "Répète la chanson"
    expected_intent: RepeatSingleOnIntent
    expected_slots: {}

  - utterance: "Répète le morceau"
    expected_intent: RepeatSingleOnIntent
    expected_slots: {}

  # JF-562 pin attempt, SKIPPED: fr-FR is the SHARTEST overlap with the newly
  # declared AMAZON.RepeatIntent (samples []) because RepeatSingleOnIntent
  # carries the BARE sample "Répète". Whether the bare form flips to the
  # built-in is live-unprobed (profile-nlu, post-deploy). Probe, then drop
  # skip_reason and set the real expectation either way.
  - utterance: "Répète"
    expected_intent: AMAZON.RepeatIntent
    expected_slots: {}
    skip_reason: "bare 'Répète' routing to the newly declared built-in vs RepeatSingleOnIntent is live-unprobed (JF-562); sharpest overlap since the custom intent carries the bare sample"

