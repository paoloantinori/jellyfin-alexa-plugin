locale: pt-BR
invocation_name: jellyfin player
tests:
  # JF-400: pt-BR had no NLU fixture file; seeded (probe-verified 2026-08-29 against the
  # pushed model) with the JF-414 indefinite album-by-artist forms plus a browse sanity
  # entry. All three album forms route to PlayAlbumIntent with the raw musician value
  # preserved (no es-US-style divergence). Extend per the JF-400 locale program.
  - utterance: "um álbum de queen"
    expected_intent: PlayAlbumIntent
    expected_slots:
      musician: {}

  - utterance: "tocar um álbum de queen"
    expected_intent: PlayAlbumIntent
    expected_slots:
      musician: {}

  - utterance: "ouvir um álbum de queen"
    expected_intent: PlayAlbumIntent
    expected_slots:
      musician: {}

  # Routing sanity: a browse phrase must not be stolen by the album forms
  # (matches the model's own sample "quero {browse_category}"; 'álbuns' is a
  # BrowseCategory type value).
  - utterance: "quero álbuns"
    expected_intent: BrowseLibraryIntent
    expected_slots:
      browse_category: {}

  # ------------------------------------------------------------------------
  # SetReminderIntent (reminder_duration / reminder_time), JF-451/JF-622
  # Probe-verified live 2026-09-08 (both slots fill).
  # ------------------------------------------------------------------------
  - utterance: "me lembre em trinta minutos"
    expected_intent: SetReminderIntent
    expected_slots:
      reminder_duration: {}

  - utterance: "me lembre às oito"
    expected_intent: SetReminderIntent
    expected_slots:
      reminder_time: {}
  # -------------------------------------------------------------------------
  # SkipForwardBackIntent (JF-875 rollout). The avança/volta verb-direction
  # synonyms ride the bare row (the rewind-as-synonym mechanism). Verified on
  # the scratch build across two identical-content rebuilds.
  # -------------------------------------------------------------------------
  - utterance: "avança 30 segundos"
    expected_intent: SkipForwardBackIntent
    expected_slots:
      seek_direction: {}
      seek_amount: {}
      seek_unit: {}

  - utterance: "volta 30 segundos"
    expected_intent: SkipForwardBackIntent
    expected_slots:
      seek_direction: {}
      seek_amount: {}
      seek_unit: {}

  # Transport steal guard (pre-existing vendor routing).
  - utterance: "próxima música"
    expected_intent: RecommendIntent
    expected_slots: {}

  # -----------------------------------------------------------------------
  # LoopAllOnIntent (no slots) - JF-904 queue-scoped carriers
  # (rationale: the loop constants in IntentNames). RED-UNTIL-DEPLOY
  # until the 13-locale model rebuild (the JF-766 convention).
  # -----------------------------------------------------------------------

  # The loop-region boundary pin (A|B alternation, the JF-902
  # convention): LoopAllOnIntent now competes in this locale's
  # loop region, so either repeat-one delivery is correct and a
  # LoopAllOnIntent delivery must fail the pin.
  - utterance: "repetir esta música"
    expected_intent: LoopSongOnIntent|AMAZON.LoopOnIntent
    expected_slots: {}

  - utterance: "repetir a fila"
    expected_intent: LoopAllOnIntent
    expected_slots: {}

  - utterance: "colocar a fila em loop"
    expected_intent: LoopAllOnIntent
    expected_slots: {}
