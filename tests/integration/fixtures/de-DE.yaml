  # JF-857 code-review catch: the new 'Suche nach dem Video {title}' sits one
  # dative article from SearchMedia's 'Suche nach einem Video {query}'
  # family; this guard pins the neighbor so a post-rebuild selection steal
  # (anti-pattern #3 class) surfaces in the suite, not on a device.
  # Probe-proven 4/4 live 2026-10-10 (query raw 'inception').
  - utterance: "Suche nach einem Video inception"
    expected_intent: SearchMediaIntent
    expected_slots:
      query:
        value: "inception"
  # -------------------------------------------------------------------------
  # SkipForwardBackIntent (JF-875 rollout; "springe vor" was the JF-684
  # no-selection class before). German word order puts the separable
  # direction particle after the amount, so the slotted direction rides the
  # row tail; the direction word never appears as a literal. Verified on the
  # scratch build across two identical-content rebuilds.
  # -------------------------------------------------------------------------
  - utterance: "springe 30 Sekunden vor"
