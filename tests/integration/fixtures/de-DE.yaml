  # ------------------------------------------------------------------------
  # JF-857 (2026-10-10): pins for the new PlayVideo strong-carrier crossings
  # (search/anschauen/schauen/zeigen tails on the Video carrier). RED until
  # the rebuilt de-DE model deploys (the JF-766 convention). The Film-carried
  # forms are trainer-anomalous (JF-770/JF-771 class) and deliberately NOT
  # pinned; the probe map and cross-locale scope live in the template's
  # PlayVideoIntent comment and task JF-857.
  # ------------------------------------------------------------------------
  - utterance: "Suche nach dem Video inception"
    expected_intent: PlayVideoIntent
    expected_slots:
      title:
        value: "inception"

  - utterance: "Video inception anschauen"
    expected_intent: PlayVideoIntent
    expected_slots:
      title:
        value: "inception"

  - utterance: "Video inception schauen"
    expected_intent: PlayVideoIntent
    expected_slots:
      title:
        value: "inception"

  - utterance: "Video inception zeigen"
    expected_intent: PlayVideoIntent
    expected_slots:
      title:
        value: "inception"

  # JF-857 green guards (probe-proven 4/4 live 2026-10-10, title raw
  # 'inception'): anchor the weak-carried search tail's exact shape and the
  # anschauen native carrier against rebuild flips.
  - utterance: "Suche nach dem Film inception"
    expected_intent: PlayVideoIntent
    expected_slots:
      title:
        value: "inception"

  - utterance: "Ich will inception anschauen"
    expected_intent: PlayVideoIntent
    expected_slots:
