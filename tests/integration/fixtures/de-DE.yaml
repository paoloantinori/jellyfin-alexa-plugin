  # -------------------------------------------------------------------------
  # 20. PlayEpisodeIntent (series_name, season_number, episode_number)
  # -------------------------------------------------------------------------
  # DIVERGENCE (documented 2026-09-12, pre-existing, JF-406 class): the German
  # episode forms leave episode_number EMPTY on the live model (word form
  # 'folge drei' and digit form 'folge 3' both probe-verified unfilled; season
  # and series fill). German PlayEpisode carriers need model work before this
  # entry can assert.
  - utterance: "spiele staffel eins folge drei von breaking bad"
    expected_intent: PlayEpisodeIntent
    expected_slots:
      series_name: {}
      season_number: {}
      episode_number: {}
    skip_reason: >-
      JF-553 bisect verdict 2026-09-13: Amazon NLU trainer nondeterminism across
      rebuilds of IDENTICAL model content (wired de-DE measured 0/10 filled, then
      1/1 filled after an equivalent rebuild; the unwired model was 10/10
      consistent, so catalog density contributes pressure but is not determinative;
      the JF-549 Zu samples are refuted as the cause: 0/10 with and without). The
      stable verb is "schau" (fills in both states); "spiele" flips. Re-enable when
      a stable window is confirmed or the carrier is reworked.

  # JF-933 fixture rework: "stranger things" removed because it is ALSO a famous
  # song title; for non-owned series whose title shares a name with a recording,
  # MusicRecording wins the anchor and PlaySongIntent steals (live-verified with
  # profile-nlu 2026-11-21, Fable analysis). Owned series route correctly (the bear,
  # adolescence, barry), and so do non-owned non-song titles (breaking bad, dark).
  # The series-last form works even for song-title series: "schau staffel 2 folge 1
  # von stranger things" routes PlayEpisodeIntent. Trainer re-roll context (JF-553)
  # kept: schau + digits is the exact-sample shape that routes.
  - utterance: "schau breaking bad staffel 2 folge 1"
    expected_intent: PlayEpisodeIntent
    expected_slots:
      series_name: {}
      season_number: {}
      episode_number: {}

  # The escape hatch for song-title series (stranger things): the series-last
  # form routes correctly even when the title IS a famous recording (Fable
  # live-verified 2026-11-21). Pinned so a trainer re-roll can't silently break it.
  - utterance: "schau staffel 2 folge 1 von stranger things"
    expected_intent: PlayEpisodeIntent
    expected_slots:
      season_number: {}
      episode_number: {}

