      channel: {}

  - utterance: "Spiele Radio jazz fm"
    expected_intent: PlayChannelIntent
    expected_slots:
      channel: {}

  # -------------------------------------------------------------------------
  # 5. PlaySongIntent (song, musician) + PlayLibrarySongIntent (JF-940)
  # JF-940: the article carriers ("das Lied", "den Titel", "den Song",
  # "das Stück") moved to PlayLibrarySongIntent (custom SongTitle type;
  # static values are training guidelines, so any title flows through).
  # PlaySongIntent keeps the bare forms ("Spiele {song}", "Spiele Lied {song}").
  # -------------------------------------------------------------------------
  # JF-940 measured-live reality (lab matrix 2026-11-22, runs jf940-de-*
  # + live probes): FAMOUS titles on the article carriers stay on
  # free-text PlaySongIntent (MusicRecording fills for knowledge-graph
  # entities and wins the competition). Functionally identical: both arms
  # play the song. These rows pin the measured routing.
  - utterance: "Spiele das Lied bohemian rhapsody"
    expected_intent: PlayLibrarySongIntent
    expected_slots:
      librarySong: {}

  - utterance: "Spiele das Lied hotel california von the eagles"
    expected_intent: PlaySongIntent
    expected_slots:
      song: {}
      musician: {}

  # JF-940 control: the bare article-less form stays on free-text PlaySongIntent
  - utterance: "Spiele bohemian rhapsody"
    expected_intent: PlaySongIntent
    expected_slots:
      song: {}

  # JF-933 (issue #46) non-famous-title pins, re-anchored by JF-940.
  # 'das Lied' + an unknown title SELECTS PlayLibrarySongIntent on the live
  # model (profile-verified 2026-11-22): the headline carrier works.
  - utterance: "spiele das lied die streithörnchen"
    expected_intent: PlayLibrarySongIntent
    expected_slots:
      librarySong: {}

  # JF-946 CATALOG-GREEN row (live-verified 2026-11-22 on the household
  # skill with the song catalog pinned): 'circles' is a REAL library track,
  # so the catalog anchors it and ALL FOUR carriers select the twin with the
  # slot filled. The lab matrix (runs jf940-de-vc/v-e) proved only
  # exact-title anchoring works; the static seed could never do this.
  - utterance: "spiele den song circles"
    expected_intent: PlayLibrarySongIntent
    expected_slots:
      librarySong: {}

  # REPORTER'S-TITLE row (out of OUR library, in the reporter's): 'die
  # streithörnchen' cannot anchor on our skill's catalog, so this row reads
  # red HERE forever while staying the live proof-phrase for the reporter's
  # skill once they enable the opt-in and their sync runs (issue #46). The
  # lab matrix (jf940-de-vc/v-e) is the evidence that only exact anchoring
  # selects; the static-seed era result for this row was NO_SELECTION.
  - utterance: "spiele den song die streithörnchen"
    expected_intent: PlayLibrarySongIntent
    expected_slots:
      librarySong: {}

