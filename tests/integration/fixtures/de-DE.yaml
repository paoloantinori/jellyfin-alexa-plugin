    expected_slots:
      seek_direction: {}
      seek_amount: {}
      seek_unit: {}

  - utterance: "spule 30 Sekunden zurück"
    expected_intent: SkipForwardBackIntent
    expected_slots:
      seek_direction: {}
      seek_amount: {}
      seek_unit: {}

  # Transport steal guard.
  - utterance: "nächstes Lied"
