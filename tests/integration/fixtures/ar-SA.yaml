locale: ar-SA
invocation_name: مجموعتي
tests:
  # JF-400: ar-SA had no NLU fixture file; seeded (probe-verified 2026-08-29 against the
  # live model) with the JF-414 indefinite album-by-artist form that routes reliably
  # bare. NOTE: 'shughl album queen' (the imperative sample) is ambiguous bare - it
  # routes deterministically to PlayVideoIntent on profile-nlu (4/4 probes) because
  # 'shughl' is generic 'play/operate'; it routes to PlayAlbumIntent when prefixed by
  # the Arabic invocation ('utlub min jellyfin player ...', verified). JF-406-class
  # data point. Extend per the JF-400 program.
  - utterance: "استمع إلى ألبوم queen"
    expected_intent: PlayAlbumIntent
    expected_slots:
      musician: {}

  # ------------------------------------------------------------------------
  # SetReminderIntent (reminder_duration / reminder_time), JF-451/JF-622
  # Probe-verified live 2026-09-08 (both slots fill).
  # ------------------------------------------------------------------------
  - utterance: "ذكرني بعد ثلاثين دقيقة"
    expected_intent: SetReminderIntent
    expected_slots:
      reminder_duration: {}

  - utterance: "ذكرني الساعة الثامنة"
    expected_intent: SetReminderIntent
    expected_slots:
      reminder_time: {}

  # ------------------------------------------------------------------------
  # JF-399 English-inertia resolution (2026-09-12): FindSong/FindSongByArtist
  # translated to Arabic; probe-verified. PlayBook carriers are stolen by
  # PlayVideoIntent/PlayArtistSongsIntent (JF-406 class) - no PlayBook entry
  # assertable yet.
  # ------------------------------------------------------------------------
  - utterance: "ابحث عن أغنية"
    expected_intent: FindSongIntent
    expected_slots: {}

  # JF-399 FindSongByArtist parity pass (2026-09-26): the ibhtagh-li carrier
  # family. Requires the model deploy; the first live suite run after it is
  # the probe.
  - utterance: "ابحث لي عن أغنية لـ queen"
    expected_intent: FindSongByArtistIntent
    expected_slots:
      musician: {}

  # JF-399 PlayPlaylist/PlayArtistSongs parity pass (2026-09-27): the
  # isma'-playlist and urid-samaa'-aghani carrier families, both
  # noun-qualified (the bare shughl shape is the documented PlayVideo
  # steal, see the header). Requires the model deploy; the first live
  # suite run after it is the probe.
  - utterance: "اسمع قائمة التشغيل روك"
    expected_intent: PlayPlaylistIntent
    expected_slots:
      playlist: {}

  - utterance: "أريد سماع أغاني queen"
    expected_intent: PlayArtistSongsIntent
    expected_slots:
      musician: {}
  # -------------------------------------------------------------------------
  # SkipForwardBackIntent (JF-875 rollout). The تقدم/تراجع verb-direction
  # synonyms ride the bare row (the rewind-as-synonym mechanism). NOTE
  # (stable across two identical-content scratch rebuilds): the word ارجع
  # leaves seek_direction UNFILLED on this trainer (تراجع and للخلف bind
  # green; a value/synonym swap was tried and moved nothing), so ارجع forms
  # are deliberately NOT pinned.
  # -------------------------------------------------------------------------
  - utterance: "تقدم 30 ثانية"
    expected_intent: SkipForwardBackIntent
    expected_slots:
      seek_direction: {}
      seek_amount: {}
      seek_unit: {}

  - utterance: "تراجع 30 ثانية"
    expected_intent: SkipForwardBackIntent
    expected_slots:
      seek_direction: {}
      seek_amount: {}
      seek_unit: {}

  # Transport steal guard (GoToChapter keeps its chapter routing).
  - utterance: "الفصل التالي"
    expected_intent: GoToChapterIntent
    expected_slots: {}

  # -----------------------------------------------------------------------
  # LoopAllOnIntent (no slots) - JF-904 queue-scoped carriers
  # (rationale: the loop constants in IntentNames). RED-UNTIL-DEPLOY
  # until the 13-locale model rebuild (the JF-766 convention).
  # -----------------------------------------------------------------------

  # The loop-region boundary pin (A|B alternation, the JF-902
  # convention): LoopAllOnIntent now competes in this locale's
  # loop region, so either repeat-one delivery is correct and a
  # LoopAllOnIntent delivery must fail the pin.
  - utterance: "كرر هذه الأغنية"
    expected_intent: LoopSongOnIntent|AMAZON.LoopOnIntent
    expected_slots: {}

  - utterance: "كرر قائمة الانتظار"
    expected_intent: LoopAllOnIntent
    expected_slots: {}

  - utterance: "أعد قائمة الانتظار"
    expected_intent: LoopAllOnIntent
    expected_slots: {}
