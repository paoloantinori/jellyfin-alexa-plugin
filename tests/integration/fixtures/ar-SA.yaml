locale: ar-SA
invocation_name: jellyfin player
tests:
  # JF-400: ar-SA had no NLU fixture file; seeded (probe-verified 2026-08-29 against the
  # live model) with the JF-414 indefinite album-by-artist form that routes reliably
  # bare. NOTE: 'shughl album queen' (the imperative sample) is ambiguous bare - it
  # routes deterministically to PlayVideoIntent on profile-nlu (4/4 probes) because
  # 'shughl' is generic 'play/operate'; it routes to PlayAlbumIntent when prefixed by
  # the Arabic invocation ('utlub min jellyfin player ...', verified). JF-406-class
  # data point. Extend per the JF-400 program.
  - utterance: "استمع إلى ألبوم queen"
    expected_intent: PlayAlbumIntent
    expected_slots:
      musician: {}

  # ------------------------------------------------------------------------
  # SetReminderIntent (duration_minutes / reminder_time), JF-451/JF-400
  # Probe-verified live 2026-09-08 (both slots fill).
  # ------------------------------------------------------------------------
  - utterance: "ذكرني بعد ثلاثين دقيقة"
    expected_intent: SetReminderIntent
    expected_slots:
      duration_minutes: {}

  - utterance: "ذكرني الساعة الثامنة"
    expected_intent: SetReminderIntent
    expected_slots:
      reminder_time: {}

  # ------------------------------------------------------------------------
  # JF-399 English-inertia resolution (2026-09-12): FindSong/FindSongByArtist
  # translated to Arabic; probe-verified. PlayBook carriers are stolen by
  # PlayVideoIntent/PlayArtistSongsIntent (JF-406 class) - no PlayBook entry
  # assertable yet.
  # ------------------------------------------------------------------------
  - utterance: "ابحث عن أغنية"
    expected_intent: FindSongIntent
    expected_slots: {}
