name: dev build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Parse version
        id: version
        run: echo "VERSION="$(grep -oP "(?<=<Version>)[^<]+" Directory.Build.props) >> $GITHUB_OUTPUT

      - name: Create version tag string
        id: version-string
        run: echo "VERSION_STRING="${{ steps.version.outputs.VERSION }}-$(date +%s)-dev >> $GITHUB_OUTPUT

      # JF-307 dual-target: SDK 10 builds both TFMs; 9.0.x provides the net9.0
      # testhost runtime. The artifact still ships the net9.0 publish below (the
      # Jellyfin 10.11 runtime line; the net10 line enters via the release flow).
      - name: Setup .NET (10.x SDK + 9.x runtime)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Build
        run: dotnet publish --configuration Debug

      - name: Test
        run: dotnet test --verbosity normal

      - name: Create zip
        run: |
          mkdir -p archive/Jellyfin.Plugin.AlexaSkill
          cp -r Jellyfin.Plugin.AlexaSkill/bin/Debug/net9.0/publish/* archive/Jellyfin.Plugin.AlexaSkill

      - name: Archive plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: AlexaSkill_${{ steps.version-string.outputs.VERSION_STRING }}
          path: archive/**/*
