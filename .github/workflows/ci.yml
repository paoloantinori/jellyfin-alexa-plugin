name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  checks: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JF-307 dual-target: SDK 10 builds both TFMs (net9.0 + net10.0); the 9.0.x
      # SDK ships the net9.0 runtime the net9.0 testhost needs (SDK 10 alone has
      # only the 10.x runtime, and dotnet test runs BOTH TFMs of the suite).
      - name: Setup .NET (10.x SDK + 9.x runtime)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      # ubuntu-latest runner images no longer ship ffmpeg. Historically
      # installed because test fixtures mocked IMediaEncoder.EncoderPath as
      # /usr/bin/ffmpeg (ResolveFfmpegPath File.Exists-gates it); those mocks
      # are all deleted (JF-765 sweep) and the full suite is verified green
      # with no ffmpeg on PATH on both TFMs, so nothing NEEDS it today. Kept
      # as a seatbelt for the CI divergence class (an ambient-path test that
      # passes locally and reds only on CI, the 2026-09-10 incident).
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: .NET Test Results
          path: "**/*.trx"
          reporter: dotnet-trx
          fail-on-error: true

  validate-models:
    runs-on: ubuntu-latest
    # Blocking since JF-556: the old advisory stance existed for the it-IT
    # SearchQuery violation, which is gone (that shape is now a warning-level
    # intent-level coexistence notice that does not affect the exit code).
    # Errors - including the Phase 8 elicit dialog-registration gate, the hard
    # gate for the anti-pattern #9 silent-directive-drop class - now fail CI.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml pytest

      - name: Validate interaction models
        run: python3 scripts/validate_interaction_models.py

      - name: Elicit checker test harness (JF-613)
        run: python3 -m pytest tests/scripts -q
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

      - name: Check generated voice-reference doc freshness
        run: python3 scripts/generate_voice_reference.py --check

  validate-locales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate locale strings
        run: python3 scripts/validate_locales.py

  validate-backlog:
    runs-on: ubuntu-latest
    # JF-854: the backlog MCP drops content that sits outside its managed
    # marker regions on rewrite (seven-occurrence gotcha); this --check run
    # is the enforcing gate (the validate-models pytest step additionally
    # carries the allowlist-aware real-tree guard).
    # JF-853 has since normalized and folded the three formerly-parked files
    # (jf-637, jf-643, jf-781), so the job is green on a clean tree; RED HERE
    # IS ALWAYS REAL (a raw tail or an overlength regenerated slug, the
    # JF-856 guard) and must never be dismissed as expected.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit backlog task files for orphan content
        run: python3 scripts/audit_backlog_orphans.py --check

  validate-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check version consistency
        run: python3 scripts/validate_versions.py

  validate-build-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Validate build.yaml
        run: python3 scripts/validate_build_yaml.py
