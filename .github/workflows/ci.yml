name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  checks: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JF-307 dual-target: SDK 10 builds both TFMs (net9.0 + net10.0); the 9.0.x
      # SDK ships the net9.0 runtime the net9.0 testhost needs (SDK 10 alone has
      # only the 10.x runtime, and dotnet test runs BOTH TFMs of the suite).
      - name: Setup .NET (10.x SDK + 9.x runtime)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      # ubuntu-latest runner images no longer ship ffmpeg, and several test
      # fixtures mock IMediaEncoder.EncoderPath as /usr/bin/ffmpeg which the
      # controller File.Exists-gates (ResolveFfmpegPath). Install it so the
      # ambient-path tests resolve instead of 503-ing (CI divergence class,
      # confirmed 2026-09-10 when the first bare-controller cache-hit tests
      # failed only on CI).
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: .NET Test Results
          path: "**/*.trx"
          reporter: dotnet-trx
          fail-on-error: true

  validate-models:
    runs-on: ubuntu-latest
    # Advisory until pre-existing it-IT SearchQuery violation is fixed
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Validate interaction models
        run: python3 scripts/validate_interaction_models.py

  validate-locales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate locale strings
        run: python3 scripts/validate_locales.py

  validate-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check version consistency
        run: python3 scripts/validate_versions.py

  validate-build-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Validate build.yaml
        run: python3 scripts/validate_build_yaml.py
