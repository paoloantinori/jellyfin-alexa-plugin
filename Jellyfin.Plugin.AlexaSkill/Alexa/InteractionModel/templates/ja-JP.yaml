# Japanese (Japan) interaction model template for the Alexa skill.
#
# JF-316 milestone 5 (final): golden master. Faithful transcription of
# the hand-grown model_ja-JP.json (59 intents, 286 samples);
# `python3 scripts/generate_interaction_model.py ja-JP` reproduces it
# byte-identically. Every sample is verbatim in the committed order:
# plain transcription over compression (the milestone-2 decision; no
# vocabulary section).
#
# Run: python3 scripts/generate_interaction_model.py ja-JP
#
# Invariants carried by this file:
# - The intent order is IDENTICAL to pt-BR's: PlayByDecade right after
#   PlayByGenre (before ContinueWatching), PlayPodcast after
#   PlayNextEpisode (before BrowseLibrary), SearchMedia after
#   QueryArtistLibrary (before PlayBook). The loop shape follows the
#   en/es families (bare AMAZON.LoopOnIntent / AMAZON.LoopOffIntent +
#   LoopSongOnIntent right after them), NOT the de/fr custom
#   LoopAllOff/On/RepeatSingleOn trio.
# - Script reality (2026-09-12 correction, live SMAPI evidence): the
#   builder REJECTS ？ (U+FF1F) in SAMPLES with InvalidCharInSamples,
#   so samples carry no question marks at all (question sentences end
#   bare: 新着はある). The 10 type-value strings still end in ？
#   (slot-type values are not samples; they pass the builder). The
#   prolonged sound mark ー (U+30FC, 98 occurrences inside loanwords)
#   is accepted. NO half-width katakana (U+FF66-FF9D) and NO
#   full-width alphanumerics (U+FF01-FF5E) anywhere. Samples use
#   regular ASCII spaces around slot refs (チャンネル {channel} を再生して),
#   never U+3000; a slot glued to a particle with no space
#   ({musician}を再生) is rejected as InvalidSample, which is why the
#   four bare-artist forms carry the space.
# - English inertia, NOT a market decision: exactly 24 samples are
#   pure English. PlayBookIntent is entirely English (8 samples), and
#   FindSongIntent (12) + FindSongByArtistIntent (4) are byte-identical
#   to es-US's English sets (the 036f7eae copy-inertia; JF-399 tracks
#   the open question). Transcribed as committed; do not "clean up"
#   here without a product decision.
# - The 9-type roster and order match pt-BR's: Mood, LibraryQueryType,
#   MediaType, BrowseCategory, SeriesName, TimePeriod, MediaInfoType,
#   Decade, AudiobookTitle. SeriesName carries 8 values with 'Money
#   Heist' UNTRANSLATED (pt-BR localizes it as La Casa de Papel);
#   Sherlock last. Decade uses the 年代 kanji forms (50年代 ... 2020年代)
#   with numeric synonyms. TimePeriod is id-first (今日 / 今週 / 今月)
#   with 1 / 2 / 2 kana synonyms.
# - Type-value key order is load-bearing for byte-identity: 31
#   id-first, 27 name-only, 3 name-first-then-id (BrowseCategory's
#   アーティスト / アルバム / 曲, mirroring pt-BR's artists/albums/songs
#   trio).
# - dialog roster and order are IDENTICAL to en-US's (PlayEpisode
#   first, its three slots elicitationRequired:true with Elicit.*
#   prompts); the 5-entry prompts section matches en-US's shape
#   including the committed reality that Elicit.SongName and
#   Elicit.AlbumName are referenced by NO dialog slot (orphan
#   prompts, JF-542; do not "clean them up" in a transcription).
# - Key order is load-bearing for byte-identity: 13 name/samples-only,
#   15 bare, 19 name/samples/slots, 12 name/slots/samples. Only
#   ShowMoreIntent carries `slots: []`; the other 13 sample-bearing
#   intents have NO slots key at all. BrowseLibraryIntent opens with
#   the lone slot-only sample '{browse_category}'.
# - NO modelConfiguration; musician slots are the BUILT-IN
#   AMAZON.Musician everywhere (no JellyfinArtist type, no JF-415
#   seed).
# - The Mood type and the slotted-only PlayMoodMusic samples are
#   OWNED HERE (JF-316 final milestone mood consolidation): the 14
#   Katakana/English loanword values (the Alexa-JP music-mood
#   convention) transcribe generate_mood_slot.py's former
#   LOCALE_MOODS ja-JP table; that script and its table were deleted
#   in this milestone with the content preserved here value-for-value.
#   Every value resolves through LocalizedMoodMap in
#   PlayMoodMusicIntentHandler.cs (JF-356 added the ja-JP block).
# - Every PlayAlbum carrier names the media アルバム (anti-pattern #11).
# - AMAZON.StopIntent has NO custom samples; the it-IT "ferma"
#   samples are a JF-402 it-IT-only exception.
