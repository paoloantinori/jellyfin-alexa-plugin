# German (de-DE) interaction model template for the Alexa skill.
#
# JF-316 milestone 3: golden master. Faithful transcription of the
# hand-grown model_de-DE.json (60 intents, 426 samples);
# `python3 scripts/generate_interaction_model.py de-DE` reproduces it
# byte-identically. Every sample is verbatim in the committed order:
# plain transcription over compression (the milestone-2 decision; no
# vocabulary section).
#
# Run: python3 scripts/generate_interaction_model.py de-DE
#
# Invariants carried by this file:
# - de-DE carries CUSTOM loop intents (a shape it shares with the fr
#   family since JF-316 milestone 4):
#   LoopAllOffIntent / LoopAllOnIntent / RepeatSingleOnIntent sit
#   where the other locales declare AMAZON.LoopOnIntent /
#   AMAZON.LoopOffIntent / LoopSongOnIntent, and LoopSongOnIntent
#   itself (6 German samples) sits LATE, after PlayBookIntent and
#   before ShowMoreIntent. 60 intents vs the en-GB/AU/CA/IN, es, and pt families' 59 (en-US carries 61);
#   the AMAZON.Loop* built-ins are not declared at all here.
# - musician slots are the BUILT-IN AMAZON.Musician everywhere (the
#   JellyfinArtist swap landed only in en-* + it-IT): languageModel
#   intents and the dialog section both. Hence 8 types, no
#   JellyfinArtist type, and NO JF-415 static seed (the validator's
#   en-family seed-equality warning does not apply to this locale).
# - modelConfiguration (fallbackIntentSensitivity LOW) IS present,
#   after types. The es family has none; en-GB has it too.
# - No `prompts` section (dialog carries no elicitation prompts);
#   dialog roster = en-GB's 7 intents, with AMAZON.Musician types.
# - Key order is load-bearing for byte-identity: intents mix
#   name/samples/slots and name/slots/samples orders (16 / 21) plus
#   10 name/samples-only and 13 bare; type values mix value-only
#   (Mood / SeriesName / AudiobookTitle), id-first (MediaType /
#   MediaInfoType / Decade / LibraryQueryType), and the BrowseCategory
#   JF-461 ids recorded value-first with id after (künstler /
#   alben / lieder), exactly as committed.
# - Seven intents carry an explicit empty `slots: []` (the same seven
#   as the en family: ClearQueue, ListQueue, TurnRadioOn/Off,
#   LearnMyVoice, WhoAmI, ShowMore).
# - Vocabulary reality, not to be normalized: PlayArtistSongs carries
#   the der/die/das gendered-article variants (Spiele/Spiel/Gib/Mach
#   and Zu spielen/Zu hören forms); samples MIX transliterated
#   ue-forms (hinzugefuegte, kuerzlich, gefaellt, moechte, uber) with
#   real umlauts (kürzlich, zufällige, nächste), exactly as
#   committed; MediaType values are capitalized (Medien / Video /
#   Audio).
# - The Mood type and the slotted-only PlayMoodMusic samples are
#   OWNED HERE (JF-316 milestone 3 mood consolidation):
#   generate_mood_slot.py no longer writes this locale (its de-DE
#   LOCALE_MOODS entry is deleted); a mood-word change is a template
#   edit + regen. The committed 14-value block with inflection
#   synonyms (JF-399) transcribes that former table; resolve targets
#   live in PlayMoodMusicIntentHandler (LocalizedMoodMap, C#).
# - SeriesName is localized (Haus des Geldes for Money Heist).
# - Every PlayAlbum carrier names the media (anti-pattern #11; the
#   bare "Spiele {album}" carrier was trimmed by JF-459).
# - AMAZON.StopIntent has NO custom samples; the it-IT "ferma"
#   samples are a JF-402 it-IT-only exception.
