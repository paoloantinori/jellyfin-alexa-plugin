dialog:
  intents:
    - name: PlayEpisodeIntent
      confirmationRequired: false
      slots:
        - name: series_name
          type: SeriesName
          confirmationRequired: false
          elicitationRequired: true
          prompts:
            elicitation: Elicit.SeriesName
        - name: season_number
          type: AMAZON.NUMBER
          confirmationRequired: false
          elicitationRequired: true
          prompts:
            elicitation: Elicit.SeasonNumber
        - name: episode_number
          type: AMAZON.NUMBER
          confirmationRequired: false
          elicitationRequired: true
          prompts:
            elicitation: Elicit.EpisodeNumber
    - name: PlaySongIntent
      confirmationRequired: false
      slots:
        - name: song
          type: AMAZON.MusicRecording
          confirmationRequired: false
          elicitationRequired: false
        - name: musician
          type: AMAZON.Musician
          confirmationRequired: false
          elicitationRequired: false
    - name: PlayAlbumIntent
      confirmationRequired: false
      slots:
        - name: album
          type: AMAZON.MusicRecording
          confirmationRequired: false
          elicitationRequired: false
        - name: musician
          type: AMAZON.Musician
          confirmationRequired: false
          elicitationRequired: false
    - name: FindSongIntent
      confirmationRequired: false
      slots:
        - name: titleKeywords
          type: AMAZON.SearchQuery
          confirmationRequired: false
          elicitationRequired: false
    - name: FindSongByArtistIntent
      confirmationRequired: false
      slots:
        - name: musician
          type: AMAZON.Musician
          confirmationRequired: false
          elicitationRequired: false
    - name: ShufflePlayIntent
      confirmationRequired: false
      slots:
        - name: playlist
          type: AMAZON.SearchQuery
          confirmationRequired: false
          elicitationRequired: false
    - name: PlayRadioIntent
      confirmationRequired: false
      slots:
        - name: station
          type: AMAZON.SearchQuery
          confirmationRequired: false
          elicitationRequired: false
prompts:
  - id: Elicit.SeriesName
    variations:
      - type: PlainText
        value: Qual série você gostaria de assistir?
      - type: PlainText
        value: Qual é o nome da série?
  - id: Elicit.SeasonNumber
    variations:
      - type: PlainText
        value: Qual temporada?
      - type: PlainText
        value: Qual número da temporada?
  - id: Elicit.EpisodeNumber
    variations:
      - type: PlainText
        value: Qual número do episódio?
      - type: PlainText
        value: Qual episódio você gostaria de assistir?
