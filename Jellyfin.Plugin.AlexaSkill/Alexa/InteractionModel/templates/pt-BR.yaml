# Portuguese (Brazil) interaction model template for the Alexa skill.
#
# JF-316 milestone 4: golden master. Faithful transcription of the
# hand-grown model_pt-BR.json (59 intents, 375 samples);
# `python3 scripts/generate_interaction_model.py pt-BR` reproduces it
# byte-identically. Every sample is verbatim in the committed order:
# plain transcription over compression (the milestone-2 decision; no
# vocabulary section).
#
# Run: python3 scripts/generate_interaction_model.py pt-BR
#
# Invariants carried by this file:
# - The loop shape follows the en/es families (bare
#   AMAZON.LoopOnIntent / AMAZON.LoopOffIntent + LoopSongOnIntent
#   early), NOT the de/fr custom LoopAllOff/On/RepeatSingleOn trio.
# - The intent ORDER diverges from es-ES in three moves:
#   PlayByDecade sits EARLY (right after PlayByGenre, before
#   ContinueWatching), PlayPodcast sits after PlayNextEpisode (before
#   BrowseLibrary), and SearchMedia sits after QueryArtistLibrary
#   (before PlayBook).
# - pt-BR carries a TimePeriod type (3 id-first values: hoje / esta
#   semana / este mês) used by PlayLastAdded's time_period slot. Within
#   this milestone's batch that is unique (the fr family lacks both);
#   across all templated locales en-US and it-IT also carry the type and
#   the slot.
# - The 9-type roster puts LibraryQueryType in position TWO (Mood,
#   LibraryQueryType, MediaType, BrowseCategory, SeriesName,
#   TimePeriod, MediaInfoType, Decade, AudiobookTitle); SeriesName
#   carries 8 values (Dark then Sherlock last; no localized tail
#   beyond La Casa de Papel).
# - dialog roster and order are IDENTICAL to en-US's (PlayEpisode
#   first, its three slots elicitationRequired:true with Elicit.*
#   prompts). The two orphan prompt definitions the golden master
#   transcribed (Elicit.SongName / Elicit.AlbumName, referenced by no
#   dialog slot) were dropped in the JF-542 cleanup (2026-09-12):
#   inert on SMAPI, and the code-driven ElicitSlot flow uses
#   ResponseStrings text, never these ids.
# - NO modelConfiguration; musician slots are the BUILT-IN
#   AMAZON.Musician everywhere (no JellyfinArtist type, no JF-415
#   seed).
# - Key order is load-bearing for byte-identity: 13 name/samples-only,
#   15 bare, 19 name/samples/slots, 12 name/slots/samples. SIX
#   intents that the fr/es families carry as `slots: []` have NO
#   slots key at all here (ClearQueue, ListQueue, TurnRadioOn/Off,
#   LearnMyVoice, WhoAmI); only ShowMore carries `slots: []`.
# - Vocabulary reality, not to be normalized: FindSong speaks
#   "musica" WITHOUT the accent (the pt sibling of es-ES's accent-less
#   "cancion"); MediaType is all-lowercase mídia / vídeo / áudio with
#   NO synonyms on media/video and [música, canção] on audio; the
#   Decade block says "cinquententa" (sic, a misspelling of
#   cinquenta) among the 50s synonyms, exactly as committed.
# - The Mood type and the slotted-only PlayMoodMusic samples are
#   OWNED HERE (JF-316 milestone 4 mood consolidation):
#   generate_mood_slot.py no longer writes this locale (its pt-BR
#   LOCALE_MOODS entry is deleted). The committed 14-value block
#   transcribes that former table; resolve targets live in
#   PlayMoodMusicIntentHandler (LocalizedMoodMap, C#).
# - Every PlayAlbum carrier names the media (anti-pattern #11; the
#   indefinite "um álbum de {musician}" form names it too).
# - AMAZON.StopIntent has NO custom samples; the it-IT "ferma"
#   samples are a JF-402 it-IT-only exception.
