# Spanish (US) interaction model template for the Alexa skill.
#
# JF-316 milestone 3: golden master. Faithful transcription of the
# hand-grown model_es-US.json (59 intents, 390 samples, the leanest
# es locale); `python3 scripts/generate_interaction_model.py es-US`
# reproduces it byte-identically.
#
# Run: python3 scripts/generate_interaction_model.py es-US
#
# es-US diverges from es-ES (otherwise identical: intent sequence,
# key orders, types, dialog, Mood block) in exactly five ways:
# - FindSongIntent (12 samples) and FindSongByArtistIntent (4) carry
#   the ENGLISH sample sets, byte-equal to en-GB's, not Spanish.
#   That is unreviewed inertia from the intent's birth (036f7eae), not a market decision; JF-399 never scoped es-US (the FindSong
#   conversation openers are English while the rest of the model is
#   Spanish); do not "translate" them back without a routing
#   decision, and do not assume the es-ES FindSong parity work
#   (JF-399) applies here.
# - BrowseLibrary drops the three leading samples "{browse_category}"
#   / "solo {browse_category}" / "quiero {browse_category}", keeping
#   the five verb-carried ones (es-ES keeps all 8, including the bare
#   "{browse_category}" sample).
# - FollowMe drops "transferir la música" (4 samples); PlayPlaylist
#   drops 5, keeping 7 of es-ES's 12; Recommend drops
#   "sugiere {media_type}" (6 samples).
# - SeriesName's last entry is El Señor de los Cielos (es-ES: El
#   Internado).
# Everything else is verbatim es-ES: the AMAZON.Musician built-in
# musician slots (no JellyfinArtist type, no JF-415 seed), the 8-type
# roster, the absent modelConfiguration, the no-prompts dialog. See
# es-ES.yaml for the family invariants.
#
# The Mood type is OWNED HERE since JF-316 milestone 3:
# generate_mood_slot.py no longer writes this locale (es-US was an
# alias of the deleted es-ES LOCALE_MOODS entry); a mood-word change
# is an edit to this template + regen.
