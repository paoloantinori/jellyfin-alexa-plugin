      - romantica
      - romantico
      - mattutina
      - serale
      - value: cena
        synonyms: [da cena]
      - value: allenamento
        synonyms: [da allenamento, allenarmi]
      - value: concentrazione
        synonyms: [concentrarmi]
      - value: festa
        synonyms: [da festa]
  Decade:
    values:
      - value: cinquanta
        id: "1950"
        synonyms: [anni cinquanta, "1950", "50"]
      - value: sessanta
        id: "1960"
        synonyms: [anni sessanta, "1960", "60"]
      - value: settanta
        id: "1970"
        synonyms: [anni settanta, "1970", "70"]
      - value: ottanta
        id: "1980"
        synonyms: [anni ottanta, "1980", "80"]
      - value: novanta
        id: "1990"
        synonyms: [anni novanta, "1990", "90"]
      - value: duemila
        id: "2000"
        synonyms: [anni duemila, "2000"]
      - value: duemiladieci
        id: "2010"
        synonyms: [anni dieci, "2010"]
      - value: duemilaventi
        id: "2020"
        synonyms: [anni venti, "2020"]
  SeriesName:
