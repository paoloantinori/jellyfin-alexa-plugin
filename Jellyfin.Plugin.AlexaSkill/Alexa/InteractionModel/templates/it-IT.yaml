# Template-based intents. Each template uses {vocab_name} references that get
# expanded via Cartesian product. Slot references like {song} are preserved.
#
# Templates produce: for each template string, substitute each vocab reference
# with each value from that vocabulary list (Cartesian product).
templates:
  PlaySongIntent:
    templates:
      - "{imperative} {song_noun} {song}"
      - "{infinitive} {song_noun} {song}"
      - "{imperative} {song} {artist_article} {musician}"
      - "{infinitive} {song} {artist_article} {musician}"
      # Live battery 2026-09-24: the NOUN-LESS bare infinitive («riprodurre
      # magnolia») hit NO_SELECTION (the trainer does not generalize
      # riproduci->riprodurre for this shape, the aggiungere class); the noun-less
      # bare IMPERATIVE («riproduci magnolia») already routes. These are the
      # wrapper twins for the one-shot remainder form.
      - riprodurre {song}
      - suonare {song}
      - mettere {song}
      - ascoltare {song}
    slots:
      - name: song
        type: AMAZON.MusicRecording
      - name: musician
        type: JellyfinArtist

  PlayPlaylistIntent:
    templates:
      - "{imperative} playlist {playlist}"
      - "{imperative} la playlist {playlist}"
      - "{infinitive} playlist {playlist}"
      - "{infinitive} la playlist {playlist}"
    slots:
      - name: playlist
        type: AMAZON.SearchQuery

  AddCurrentToPlaylistIntent:
    templates:
      - Aggiungi questo brano alla playlist {playlist}
      - Aggiungi questo alla playlist {playlist}
      - Metti questo brano nella playlist {playlist}
      - aggiungere questo brano alla playlist {playlist}
      - aggiungere questo alla playlist {playlist}
      - Di aggiungere questo brano alla playlist {playlist}
    slots:
      - name: playlist
        type: AMAZON.SearchQuery
  AddSongToPlaylistIntent:
    templates:
      - Aggiungi la canzone {song_query}
      - Aggiungi il brano {song_query}
      - Metti la canzone {song_query}
      - Aggiungi alla playlist {playlist_target}
      - aggiungere la canzone {song_query}
      - aggiungere il brano {song_query}
      - aggiungere alla playlist {playlist_target}
      - Di aggiungere la canzone {song_query}
      - Di aggiungere il brano {song_query}
      - Di aggiungere alla playlist {playlist_target}
    slots:
      - name: song_query
        type: AMAZON.SearchQuery
      - name: playlist_target
        type: AMAZON.SearchQuery
  RemoveCurrentFromPlaylistIntent:
    templates:
      - Rimuovi questo brano dalla playlist {playlist}
      - Rimuovi questo dalla playlist {playlist}
      - Togli questo brano dalla playlist {playlist}
    slots:
      - name: playlist
        type: AMAZON.SearchQuery
  CreatePlaylistIntent:
    templates:
      - Crea una playlist chiamata {playlist}
      - Crea una nuova playlist chiamata {playlist}
      - Nuova playlist chiamata {playlist}
      - Crea una playlist {playlist}
      - Crea playlist {playlist}
      - Crea playlist chiamata {playlist}
      - Nuova playlist {playlist}
    slots:
      - name: playlist
        type: AMAZON.SearchQuery
  PlayAlbumIntent:
    templates:
      - "{imperative} {album_noun} {album}"
      - "{infinitive} {album_noun} {album}"
      - "{imperative} {album_noun} {album} {artist_article} {musician}"
      - "{infinitive} {album_noun} {album} {artist_article} {musician}"
      # JF-411: indefinite album-by-artist forms ("un disco dei Koop" routed to
      # FallbackIntent/RecommendIntent on-device because no sample carried the
      # musician without an album title).
      - "un disco di {musician}"
      - "un album di {musician}"
      - "un disco dei {musician}"
      - "un album dei {musician}"
      - "{imperative} un disco di {musician}"
      - "{imperative} un album di {musician}"
      - "{imperative} un disco dei {musician}"
      - "{imperative} un album dei {musician}"
      - "{infinitive} un disco di {musician}"
      - "{infinitive} un album di {musician}"
      - "{infinitive} un disco dei {musician}"
      - "{infinitive} un album dei {musician}"
      # JF-411 hardening: desiderative forms previously bled the whole phrase into
      # the musician slot (profile-nlu: "vorrei un disco dei koop" -> musician
      # "1 disco dei koop"); carrier-anchored forms give the on-device NLU an
      # explicit fill anchor (same rationale as artist_carrier).
      - "vorrei un disco di {musician}"
      - "vorrei un disco dei {musician}"
      - "vorrei un album di {musician}"
      - "vorrei un album dei {musician}"
      - "vorrei ascoltare un disco di {musician}"
      - "vorrei ascoltare un album di {musician}"
      - "un disco della band {musician}"
      - "un album della band {musician}"
      - "un disco del gruppo {musician}"
      - "un album del gruppo {musician}"
      - "c'e un album chiamato {album}"
      - "c'e un disco chiamato {album}"
      # JF-441: bare indefinite chiamato forms. Without these the fill boundary
      # drifts and the literal bleeds into the slot (profile-nlu: "un album
      # chiamato surfer rosa" -> album "chiamato surfer rosa", even for
      # in-catalog titles); anchoring the carrier gives the no-c'e shape the
      # same boundary the c'e pair already has.
      - "un album chiamato {album}"
      - "un disco chiamato {album}"
      # JF-490: 'che si chiama' carrier, device-evidenced (corr=7446fba8,
      # 2026-09-04: "un album che si chiama surfer rosa" matched NO intent,
      # FallbackIntent on-device, and the bare retry went to Amazon Music).
      # Same anchor rationale as the JF-441 chiamato pair: without a sample
      # every considered fill bleeds into musician.
      - "un album che si chiama {album}"
      - "un disco che si chiama {album}"
      # JF-490 device follow-up (2026-09-05): the bare 'che si chiama' pair
      # matches in profile-nlu on the exact string but NOT on-device ASR (four
      # FallbackIntent attempts, in-session and one-shot: corr=d94fb3da,
      # f8cba7bd, 6a8f15cc, 170aff3d), while the chiamato family from the same
      # rebuild routes fine on-device (corr=7a54cdf1). The statistical matcher
      # needs verb-ful anchors for this carrier; the imperative product adds
      # five verb forms over both nouns.
      - "{imperative} un album che si chiama {album}"
      - "{imperative} un disco che si chiama {album}"
      # JF-490: cerca+chiamato as a PLAY shape. JF-469 excluded cerca from the
      # play intent on purity grounds; overturned by device evidence
      # (corr=f919db65, 2026-09-04: "cerca un album chiamato surfer rosa" is
      # a play request; the statistical router already selects PlayAlbumIntent
      # but the fill drifts into musician). The sample anchors the fill
      # boundary, it does not move any utterance class between intents.
      - "cerca un album chiamato {album}"
      - "cerca un disco chiamato {album}"
      - "Fai suonare l'album {album}"
      - "Fai suonare il disco {album}"
    slots:
      # DO NOT change to AMAZON.MusicRecording / AMAZON.Album to fix one-shot
      # routing. AlbumName is catalog-sync-backed (JF-96.2) with Italian phonetic
      # synonyms for cross-language matching. See CLAUDE.md anti-pattern #10.
      - name: album
        type: AlbumName
      - name: musician
        type: JellyfinArtist

  PlayArtistSongsIntent:
    templates:
      - "{media_noun} {artist_article} {musician}"
      - "{imperative} {media_noun} {artist_article} {musician}"
      - "{infinitive} {media_noun} {artist_article} {musician}"
      - "{imperative} {artist_carrier} {musician}"
      - "{infinitive} {artist_carrier} {musician}"
      # JF-418: bare imperative/infinitive forms (the most natural Italian: "Suona
      # Pink Floyd", "Di suonare Pink Floyd"). Previously ALL samples required a noun
      # carrier (brani/canzoni/musica) or artist carrier (la band/il gruppo), so the
      # natural phrasing without them routed to PlayVideoIntent or returned no match.
      - "{imperative} {musician}"
      - "{infinitive} {musician}"
      # JF-418: nominative article forms (natural Italian: "Suona i Pink Floyd",
      # "Di suonare i Queen", "Suona la Mina"); without these samples the
      # NLU rejects the article.
      - "{imperative} {nominative_article} {musician}"
      - "{infinitive} {nominative_article} {musician}"
    slots:
      - name: musician
        type: JellyfinArtist

  PlayLastAddedIntent:
    templates:
      - "{imperative} {last_added_phrase}"
      - "{infinitive} {last_added_phrase}"
      - "{imperative} {last_added_time_phrase}"
      - "{infinitive} {last_added_time_phrase}"
    slots:
      - name: media_type
        type: MediaType
      - name: time_period
        type: TimePeriod

  PlayFavoritesIntent:
    templates:
      - "{imperative} {favorites_noun}"
      - "{infinitive} {favorites_noun}"
      - "{imperative} i miei {media_type} preferiti"
      - "{infinitive} i miei {media_type} preferiti"
    slots:
      - name: media_type
        type: MediaType

  # JF-324: series-first episode addressing. The series-first family stays
  # hand-picked (Riproduci/Suona/Metti only) as originally curated; JF-493 adds
  # the numbers-first family below as full imperative/infinitive vocab products
  # ("metti la stagione 1 episodio 1 di X" had NO sample at all, so profile-nlu
  # considered PlayEpisodeIntent but never selected it).
  PlayEpisodeIntent:
    templates:
      - Riproduci {series_name} stagione {season_number} episodio {episode_number}
      - Suona {series_name} stagione {season_number} episodio {episode_number}
      - Metti {series_name} stagione {season_number} episodio {episode_number}
      # JF-493: numbers-first family (stagione/episodio before the series name),
      # both the bare imperative and the one-shot infinitive twin
      # ("chiedi a mia collezione di mettere la stagione 1 episodio 1 di X").
      - "{imperative} la stagione {season_number} episodio {episode_number} di {series_name}"
      - "{infinitive} la stagione {season_number} episodio {episode_number} di {series_name}"
      # JF-549: series-FIRST infinitive twin; the one-shot wrapper presents the
      # series up front and the series-last forms alone dropped series_name (live 2026-09-12).
      - "{infinitive} {series_name} stagione {season_number} episodio {episode_number}"
    slots:
      - name: series_name
        type: SeriesName
      - name: season_number
        type: ItalianNumber
      - name: episode_number
        type: ItalianNumber

  # JF-324: next/latest-episode playback and "continue watching {series}". All
  # carriers name the episode (prossimo/ultimo episodio) or the continuation verb,
  # so PlayEpisodeIntent's number-carrying samples keep their own region; the
  # series_name slot reuses the SeriesName type PlayEpisode already declares.
  # JF-493: infinitive one-shot twins ("chiedi a mia collezione di mettere il
  # prossimo episodio di X") previously had no sample, so the greedy PlayArtistSongs
  # musician slot absorbed the series name instead.
  # JF-583: the prossimo/ultimo families are slotted through {episode_position}
  # (custom EpisodePosition type, the Mood architecture): prossimo keeps the
  # NextUp core, ultimo resolves by recency. The articles ride the type values
  # ("il prossimo" / "l'ultimo"); an empty/unresolved slot defaults to NextUp
  # (the historical behavior, also what the Continua-a-guardare family means).
  PlayNextEpisodeIntent:
    templates:
      - Riproduci {episode_position} episodio di {series_name}
      - Metti {episode_position} episodio di {series_name}
      - Guarda {episode_position} episodio di {series_name}
      - Continua a guardare {series_name}
      - Continua a guardare la serie {series_name}
      # JF-493: infinitive twins of the position families and of
      # "Continua a guardare la serie". The "la serie" noun stays in the carrier:
      # a bare "{infinitive} {series_name}" would be a bare carrier competing
      # with the artist region.
      - "{infinitive} {episode_position} episodio di {series_name}"
      # JF-583 NLU history: the infinitive family originally lost to PlayByGenre's
      # greedy "Di riprodurre {genre}"; JF-585 removed that greedy sibling and the
      # explicit literal carriers tried in 532159bc were removed again after the
      # live probe showed they SUPPRESS the episode_position slot fill (the
      # vocabulary expansion of "{infinitive} {episode_position} episodio di
      # {series_name}" already generates those exact phrases as slotted samples).
      - "{infinitive} la serie {series_name}"
    slots:
      - name: series_name
        type: SeriesName
      - name: episode_position
        type: EpisodePosition

# Dialog configuration for intents that use Dialog.ElicitSlot directives.
# Without these entries Alexa silently ignores ElicitSlot and routes
# the user's follow-up utterance through general NLU (→ Amazon Music).
dialog:
  intents:
    - name: RateItemIntent
      confirmationRequired: false
      slots:
        - name: star_rating
          type: ItalianNumber
          confirmationRequired: false
          elicitationRequired: false
    - name: FindSongIntent
      confirmationRequired: false
      slots:
        - name: titleKeywords
          type: AMAZON.SearchQuery
          confirmationRequired: false
          elicitationRequired: false
    - name: FindSongByArtistIntent
      confirmationRequired: false
      slots:
        - name: musician
          type: JellyfinArtist
          confirmationRequired: false
          elicitationRequired: false
    - name: ShufflePlayIntent
      confirmationRequired: false
