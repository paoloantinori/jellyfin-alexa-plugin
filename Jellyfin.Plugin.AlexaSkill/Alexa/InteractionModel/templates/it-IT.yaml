# Custom slot type definitions. These are emitted into the model's types section.
# Each type has a name and a list of values (with optional id and synonyms).
# Key order is load-bearing for byte-identity: `value` first emits the name
# subtree first, `id` first emits id first (see generate_interaction_model.py).
types:
  Mood:
    values:
      - rilassante
      - relaxante
      - calma
      - value: dormire
        synonyms: [per dormire]
      - allegra
      - allegramente
