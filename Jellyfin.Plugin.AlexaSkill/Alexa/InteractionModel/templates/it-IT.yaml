      - Stranger Things
      - La Casa di Carta
      - Peaky Blinders
      - The Walking Dead
      - Dark
      - Lupin
  # JF-583: restricted episode-position vocabulary on PlayNextEpisodeIntent
  # (the JF-354 Mood architecture). Ids are the shared cross-locale key space
  # the handler's entity resolution reads (next/latest); synonyms cover the
  # article-less and gendered spoken forms.
  EpisodePosition:
    values:
      - value: il prossimo
        id: "next"
        synonyms: [prossimo, il successivo, successivo]
      - value: "l'ultimo"
        id: latest
