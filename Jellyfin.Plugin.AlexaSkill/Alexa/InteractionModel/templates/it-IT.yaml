# Italian interaction model templates for Alexa skill.
#
# Vocabulary sets are expanded via Cartesian product into utterance samples.
# Slot references like {song} are preserved as-is (not expanded).
# To add a new verb (e.g. "Ascolta"), just add it to the imperative/infinitive lists.
#
# Run: python scripts/generate_interaction_model.py it-IT

invocationName: mia collezione

vocabulary:
  imperative: [Riproduci, Suona, Metti, Pleia, Ascolta]
  infinitive: [Di riprodurre, Di suonare, Di mettere, Di pleiare, Di ascoltare]

  # Nouns MUST include the definite article Italians actually speak ("l'album",
  # "il disco", "il brano", ...). Bare nouns produce ungrammatical samples
  # ("mettere album X") that never match real speech, so the utterance falls
  # through to a competing intent. Keep article + bare forms together.
  song_noun: [il brano, la canzone, il pezzo, la traccia]
  album_noun: ["l'album", "il disco", album, disco, "il cd", "la raccolta", "il vinile"]
  artist_article: [di, dei, degli, delle]
  # Nominative (subject-position) definite articles, NOT genitive like
  # artist_article: bands take plurals ("i Pink Floyd", "gli Stooges"),
  # solo artists take singulars ("la Mina", "lo Zucchero").
  # C# twin: KeywordMatcher.StopWords["it"] opens with these same six articles
  # (query tokenization); add any new article to BOTH lists.
  nominative_article: [il, lo, la, i, gli, le]
  artist_carrier: [la band, il gruppo, il cantante, la cantante]
  media_noun: [brani, canzoni, musica, un brano, una canzone, un pezzo, una traccia]
  favorites_noun: [i miei preferiti, "{media_type} preferiti"]
  last_added_phrase: ["novità {media_type}", "ultimi {media_type} aggiunti", "nuovi media"]
  last_added_time_phrase: ["{media_type} aggiunti {time_period}", "novità {media_type} {time_period}", "{media_type} {time_period}"]
  time_period_val: [oggi, "questa settimana", "questo mese"]

# Intents that are fully static (no templates). Listed here so the generator
# knows to preserve them from the base JSON if present.
static_intents:
  - AMAZON.CancelIntent
  - AMAZON.HelpIntent
  - AMAZON.FallbackIntent
  - AMAZON.PauseIntent
  - AMAZON.ResumeIntent
  - AMAZON.NextIntent
  - AMAZON.PreviousIntent
  - AMAZON.YesIntent
  - AMAZON.NoIntent
  # JF-562: the Loop* built-ins ride next to the custom LoopAll* vocabulary in
  # explicit_intents (dual-accept CanHandle per JF-450: whichever name wins
  # NLU, the same loop mode applies).
  - AMAZON.LoopOnIntent
  - AMAZON.LoopOffIntent
  - AMAZON.ShuffleOnIntent
  - AMAZON.ShuffleOffIntent
  - AMAZON.StartOverIntent
  - AMAZON.RepeatIntent

# Intents with explicit samples (not generated from templates).
# Each has a "samples" list and optional "slots" list.
explicit_intents:
  # DELIBERATE EXCEPTION to anti-pattern #5 ("never add custom samples to AMAZON.*
  # built-ins", see CLAUDE.md): these it-IT samples make the imperative "ferma" route
  # one-shot to StopIntent on Italian Echos. Added in the early template era (May 2026,
  # SleepTimer epoch); no incident documented against it. Do NOT remove blindly:
  # first verify on-device/profile-nlu that "ferma" still routes without them
  # (tracked as device-testing follow-up of JF-402).
  AMAZON.StopIntent:
    samples:
      - ferma
      - ferma tutto
      - ferma la musica
      - ferma riproduzione
      - ferma la riproduzione
      - stop
  LoopAllOffIntent:
    samples:
      - Disattiva loop
      - Disattiva ripetizione
  ShuffleAllOnIntent:
    samples:
      # Live incident 2026-09-23: «mescola la coda» statistically landed on
      # ClearQueueIntent (the AMAZON.ShuffleOn built-in carries no custom samples,
      # anti-pattern #5). Custom twins per the LoopAllOn precedent (JF-450/JF-562).
      - Attiva mescolamento
      - Attiva il casuale
      - Mescola la coda
      - Mescola la riproduzione
      - attivare il mescolamento
      - mescolare la coda
      - Di attivare il mescolamento
  ShuffleAllOffIntent:
    samples:
      - Disattiva mescolamento
      - Disattiva il casuale
      - Ripristina l'ordine della coda
      - disattivare il mescolamento
      - Di disattivare il mescolamento
  LoopAllOnIntent:
    samples:
      - Attiva loop
      - Attiva ripetizione
  RepeatSingleOnIntent:
    samples:
      # JF-438: the old "Suonalo ancora"/"Suonala ancora" forms collided with the
      # "Suona la/il ..." prefix region (artist carriers and nominative articles:
      # profile-nlu routed "suona la band queen" HERE). Repeat-one keeps the
      # "Ripeti*" family only; do not reintroduce "Suona + clitic" shapes.
      - Ripeti la canzone
      - Ripeti la traccia
      - Ripeti il brano
      - Ripeti il video
      - di ripeter la canzone
      - di ripeter la traccia
      - di ripeter il brano
      - di ripeter il video
      - Ripetilo
      - Ripetila
      - di ripeterlo
      - di ripeterla
      - riplei
      - replei
      # Review round (JF-438): restores an "ancora" repeat phrasing without the
      # "Suona + clitic" prefix that collided with the artist article/carrier region.
      - Ripeti ancora
      - di ripetere ancora
  PlayChannelIntent:
    samples:
      - Canale {channel}
      - Riproduci radio {channel}
      - di riprodurre la radio {channel}
      - di mettere la radio {channel}
      - Radio {channel}
    slots:
      - name: channel
        type: AMAZON.SearchQuery
  PlayVideoIntent:
    samples:
      - Riproduci {title}
      - Suona {title}
      - Metti {title}
      - Pleia {title}
      # Live battery 2026-09-23: 'riprodurre il film ada' hit FallbackIntent (the
      # bare-infinitive NOUN-CARRYING twin was missing; the JF-541 removal only
      # condemned the NOUN-LESS 'riprodurre {title}') and 'riprodurre un film'
      # was stolen by RecommendIntent's greedy media_type ('1 film'). The
      # title-less forms are legal per the JF-403 boundary: the empty title
      # now ELICITS (the dead-mic Tell was the JF-549-class defect).
      - Riproduci un film
      - Riproduci un video
      - riprodurre un film
      - di riprodurre un film
      - riprodurre il film {title}
      - riprodurre un video {title}
      # JF-541 (2026-09-11): the bare INFINITIVE pair 'Di riprodurre {title}' /
      # 'Di suonare {title}' is REMOVED. JF-504 already proved them inert for
      # pure movie titles ('di riprodurre ada' -> no selection, 'di riprodurre
      # il film ada' -> FallbackIntent), so they deliver no video routing; on
      # the catalog-supplied deployed model they only swallow infinitive
      # music/album phrases into the free-text title (probe 2/2: 'Di suonare
      # musica dei maneskin' -> PlayVideoIntent title='musica dei maneskin',
      # 'Di suonare disco thriller' -> title='disco thriller'; the anchored
      # twin 'Di suonare musica dei pink floyd' correctly wins
      # PlayArtistSongsIntent, so the steal fires when the artist lacks a
      # catalog anchor). With them gone the verbatim PlayArtistSongs
      # '{infinitive} {media_noun} {artist_article} {musician}' and PlayAlbum
      # '{infinitive} {album_noun} {album}' products get the race back. The
      # bare IMPERATIVE quartet above stays: JF-436/JF-470 show it is dead
      # weight on Suona/Metti/Pleia (never selected) and no JF-541 failure
      # routes through it; removing uncondemned samples shifts statistics we
      # cannot verify from here. Same-family sibling on PlayByGenreIntent
      # (Di riprodurre {genre}) REMOVED by JF-585: the live probe condemned it
      # (10/10 profile-nlu steals of the episode position family,
      # deterministic across two identical-content rebuilds; the genre
      # captures it made were recovered handler-side, but the episode-position
      # captures were NOT recoverable at all). The infinitive genre ask
      # survives via the anchored 'Di riprodurre genere {genre}' sample.
      - voglio guardare {title}
      - fai vedere {title}
      - fammi vedere {title}
      - mostra {title}
      - voglio vedere {title}
      # JF-504: media-named movie carriers. The bare verb+title samples above
      # lose against the catalog-heavy model ('di riprodurre il film ada' fell
      # to FallbackIntent, 'riproduci il film ada' and 'di riprodurre ada' to
      # no selection; 2026-09-06 device session: three phrasings, zero requests
      # reached the skill). Every carrier names the media (no bare carriers,
      # anti-patterns #1/#11). Verb subset is Riproduci/Metti only: Suona/Pleia/
      # Ascolta are music-performance verbs, unidiomatic with a film object
      # (anti-pattern #6 discipline applied by hand; explicit_intents samples
      # are not template-expanded by the generator). 'cerca il film' follows
      # the JF-490 cerca-as-play precedent.
      - Riproduci il film {title}
      - Metti il film {title}
      - Di riprodurre il film {title}
      - Di mettere il film {title}
      - voglio guardare il film {title}
      - cerca il film {title}
      # JF-504 device follow-up (2026-09-06): the invocation-wrapped one-shot fell
      # to Fallback on-device while every clean string routed in profile-nlu (the
      # known device-vs-profiler divergence). The guardare family is the one the
      # user actually speaks (bare 'voglio guardare il film ada' works on-device),
      # so its infinitive twins anchor that family for the one-shot shape.
      - Di guardare il film {title}
      - Di vedere il film {title}
    slots:
      - name: title
        type: AMAZON.SearchQuery
  PlayByGenreIntent:
