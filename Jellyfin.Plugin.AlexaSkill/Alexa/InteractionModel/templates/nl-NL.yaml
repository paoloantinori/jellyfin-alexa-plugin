# Dutch (Netherlands) interaction model template for the Alexa skill.
#
# JF-316 milestone 5 (final): golden master. Faithful transcription of
# the hand-grown model_nl-NL.json (59 intents, 362 samples);
# `python3 scripts/generate_interaction_model.py nl-NL` reproduces it
# byte-identically. Every sample is verbatim in the committed order:
# plain transcription over compression (the milestone-2 decision; no
# vocabulary section).
#
# Run: python3 scripts/generate_interaction_model.py nl-NL
#
# Invariants carried by this file:
# - The intent order is IDENTICAL to pt-BR's: PlayByDecade right after
#   PlayByGenre (before ContinueWatching), PlayPodcast after
#   PlayNextEpisode (before BrowseLibrary), SearchMedia after
#   QueryArtistLibrary (before PlayBook). The loop shape follows the
#   en/es families (bare AMAZON.LoopOnIntent / AMAZON.LoopOffIntent +
#   LoopSongOnIntent right after them), NOT the de/fr custom
#   LoopAllOff/On/RepeatSingleOn trio.
# - Vocabulary reality, not to be normalized: the model is 100% ASCII;
#   not one of the 362 samples carries a diacritic (loanwords sit
#   unaccented: media, genre, serie). LibraryQueryType (tracks /
#   albums) and MediaType (media / video / audio) values are English
#   cognates as committed, not translated.
# - ENGLISH INERTIA (JF-399, the 036f7eae copy-in class): nl carries
#   the same 24 pure-English samples as ja/hi/ar and es-US - PlayBook
#   fully English (8) and FindSong (12) + FindSongByArtist (4)
#   byte-equal to es-US English sets. Transcribed as committed; do
#   not translate without the JF-399 routing decision.
# - The 9-type roster and order match pt-BR's: Mood, LibraryQueryType,
#   MediaType, BrowseCategory, SeriesName, TimePeriod, MediaInfoType,
#   Decade, AudiobookTitle. SeriesName carries 8 values with 'Money
#   Heist' UNTRANSLATED (pt-BR localizes it as La Casa de Papel);
#   Sherlock last. Decade uses jaren 50 ... jaren 2020 with spelled
#   and numeric synonyms. TimePeriod is id-first (vandaag / deze week
#   / deze maand) with 1 / 3 / 3 past-period synonyms, the same shape
#   as pt-BR's.
# - Type-value key order is load-bearing for byte-identity: 31
#   id-first, 27 name-only, 3 name-first-then-id (BrowseCategory's
#   artiesten / albums / nummers, mirroring pt-BR's
#   artists/albums/songs trio).
# - dialog roster and order are IDENTICAL to en-US's (PlayEpisode
#   first, its three slots elicitationRequired:true with Elicit.*
#   prompts). The two orphan prompt definitions the golden master
#   transcribed (Elicit.SongName / Elicit.AlbumName, referenced by no
#   dialog slot) were dropped in the JF-542 cleanup (2026-09-12):
#   inert on SMAPI, and the code-driven ElicitSlot flow uses
#   ResponseStrings text, never these ids.
# - Key order is load-bearing for byte-identity: 13 name/samples-only,
#   15 bare, 19 name/samples/slots, 12 name/slots/samples. Only
#   ShowMoreIntent carries `slots: []`; the other 13 sample-bearing
#   intents have NO slots key at all. BrowseLibraryIntent opens with
#   the lone slot-only sample '{browse_category}'.
# - NO modelConfiguration; musician slots are the BUILT-IN
#   AMAZON.Musician everywhere (no JellyfinArtist type, no JF-415
#   seed).
# - The Mood type and the slotted-only PlayMoodMusic samples are
#   OWNED HERE (JF-316 final milestone mood consolidation): the 14
#   Dutch values (ontspannend ... slapen; concentratie carries
#   synonym focus, blij carries gelukkig, slapen carries slaap)
#   transcribe generate_mood_slot.py's former LOCALE_MOODS nl-NL
#   table; that script and its table were deleted in this milestone
#   with the content preserved here value-for-value. Every value AND
#   synonym resolves through LocalizedMoodMap in
#   PlayMoodMusicIntentHandler.cs (JF-356 added the nl-NL block).
# - Every PlayAlbum carrier names the media (anti-pattern #11; the
#   indefinite "een album van {musician}" form names it too).
# - AMAZON.StopIntent has NO custom samples; the it-IT "ferma"
#   samples are a JF-402 it-IT-only exception.
