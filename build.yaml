changelog: "Fixed a bug where artist or item names containing characters Amazon rejects in slot values (such as the asterisk in *NSYNC) made every skill response fail, leaving the skill unable to open at all. Names are now cleaned before being sent to Alexa, and items whose names clean to nothing are skipped. Also corrected the README's list of default invocation names (German, Spanish, French, Portuguese and Dutch each have a native default) and documented the reliable skill-opening phrasing when plain open is intercepted."
