changelog: "Fixes artist and playlist playback for users who restrict the skill to specific libraries: with a per-user library restriction configured, every artist request returned no results and playlists could not be found at all. Asking for an artist, a playlist or a song now behaves the same with or without library restrictions. Playlist requests no longer apply the library filter, since playlists live outside libraries. Song search by name is also faster again for restricted users: it was silently falling back to the slower library-wide search path."
