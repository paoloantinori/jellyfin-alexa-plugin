changelog: "NEW: you can now shuffle an album by name (English: 'shuffle the album <name>'); the whole album plays in random order. NEW: a 'Recreate Catalogs' button in the plugin settings fixes the case where Alexa suddenly stops matching any artist, album, series or song name across the board (Amazon-side catalog loss): one click clears the stale references and rebuilds them from your library. The plugin now also detects that condition on its own and reports it in the locale status panel. NEW: more natural one-shot phrasings in English, French and Spanish ('ask Jellyfin to ...'). FIXED: German song requests like 'Spiele das Lied <title>' now reliably reach the right intent even when Alexa does not know the title (children's audio plays, personal recordings); unknown titles route to a play intent instead of media-info or radio. IMPROVED: when a voice-model test run hits errors, every erroring phrase now reports why (expired login, malformed response) instead of failing silently. KNOWN ISSUES: in Spanish and French, some episode and skip phrasings may not be recognized after a catalog sync; alternative phrasings work. On Echo Show devices with seek-mode enabled, shuffling an album or playlist plays one random track and stops instead of continuing (a platform limitation of that playback mode). A small number of generic music requests can match a song title that exists literally in your library."
