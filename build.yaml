changelog: "Song search is now much more forgiving on every front: titles stored with abbreviations (\"Decatur St.\") are found when you say the full word (\"Decatur Street\"), a single misheard word no longer blocks an otherwise correct request, and the right song now ranks first instead of a coincidental match (e.g. \"Decatur St.\" beats \"St. Gregory\" when you said \"street\"). The skill asks for confirmation instead of silently playing a loosely-matching artist, no longer fails with \"something went wrong\" when a dialog prompt and background updates collide, no longer crashes when you abandon a song-search conversation, and \"Alexa, stop\" now works even after starting playback from an interactive session. New troubleshooting guides cover reverse-proxy/Cloudflare setups, the missing seek bar, follow-me behavior and more."
