changelog: "The first major release. Audiobooks work end to end: asking for a book plays the whole book instead of a single chapter, chapters play in the right order even when the files carry no track metadata, and resume works from any point on any Echo device. Confirmations now match direct requests everywhere: answering yes to a did-you-mean plays exactly what the direct ask would, with the same resume point and queue. Restricted-library users get correct playback (shared streams no longer mix between library scopes). After a server restart the skill answers clearly while its indexes warm up instead of failing, and this protection now covers books, albums, artists, playlists and shuffle requests. The first play of a transcoded episode starts correctly. Sleep timers, reliable resume, spoken confirmations for shuffle and repeat, radio autoplay and the smoother multi-turn conversations from the earlier line are all included. Works on Jellyfin 10.11 and Jellyfin 12 (one download per server line, the catalog picks automatically)."
