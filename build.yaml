changelog: "Playback queues now follow a speaker that sends its voice commands and its playback events under two different Alexa device identities (Sonos speakers with built-in Alexa do this): album and playlist continuation, loop mode and transport controls resolve against the right queue again, with tap controls included. Also fixed a locale bug that could corrupt audiobook resume playlists on machines with a comma-decimal language setting. Network note: if a speaker stopped streaming after your router or firewall changed, check that it can still reach the Jellyfin server on port 443; a household incident on Oct 27 was exactly that, not the plugin."
