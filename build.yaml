changelog: "Loop now repeats the track you are listening to and the setting survives track changes; whole-queue repeat is available in all 17 languages. Adds photo slideshows on Echo Show, one-shot film requests by title, skip forward and back in every language, and honest which-did-you-mean questions for ambiguous artist requests. Pause and stop say what they actually stopped (music, book or video), asking for a film without a title now prompts for it, resume keeps offering the same item it will play, sleep timers confirm what they will really do, and shuffle, repeat and loop answer out loud when they take effect. Includes many reliability fixes around search, playback and session handling. 1.0.1 fixes: the loop now reliably repeats the current track (a server timer used to reset the repeat setting mid-song); disabling the loop stops a pending track repeat instead of letting it play; the resume offer on Echo Show shows the correct track name instead of unknown content; French one-shot commands route correctly; Italian ordinals ('la prima', 'la seconda') and their voice-transcribed forms are understood in song selection."
