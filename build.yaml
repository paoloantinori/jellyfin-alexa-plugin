changelog: "Movie titles shared by several films now ask which one you meant instead of silently playing the first match. Skip forward and back now work as one-shot commands in French, Spanish and Dutch. Fixed an Italian regression where asking to put on music by an artist offered a list of similarly named artists instead of playing them. Artist names heard without a silent letter (Norah heard as Nora) now resolve once your catalog resyncs. Asking to put on music by an artist in English no longer answers with a wrong song title. Decade requests now understand native Hindi values, and decade words in Arabic and Italian that never worked before now resolve. Includes further reliability fixes around search, playback and session handling."
