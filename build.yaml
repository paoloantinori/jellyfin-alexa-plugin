changelog: "The first major release. Works on both Jellyfin 10.11 and Jellyfin 12 servers (one download per server line, the catalog picks the right one automatically). Sleep timers now understand the duration you say: ask to stop after thirty seconds, half an hour or one hour and that is exactly what you get, with a truthful confirmation when the stop will land at the end of the current track. Asking to resume now reliably continues what you last listened to on that device, whether it was music, a podcast or an audiobook, instead of jumping to something unrelated. Shuffle, repeat and loop commands now answer with a spoken confirmation so you know they took effect, and shuffle works when asked in Italian, German and French. Radio mode plays similar tracks you have not just heard instead of restarting the current song. If you ask for a new command while the skill is waiting for an answer to a question, it now cancels the question cleanly and tells you to repeat the command. Video requests finally accept being asked without a title first (the skill asks which one) and accept the film name in one shot. Artist information no longer reads punctuation aloud when listing genres. Many smaller routing fixes for one-shot phrasings across all supported languages."
