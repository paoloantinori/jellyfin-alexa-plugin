changelog: "NEW: lyrics on the Echo Show. While a song plays, say \"show the lyrics\" (or \"mostra i testi\" and the same phrase in every supported language) and the current song restarts on screen with its time-synced lyrics displayed over the music. Works for songs that have a synced lyrics file (LRC) on the server; songs without one say so. Normal playback is unchanged. FIXED: shuffling a playlist now shuffles the whole playlist. It previously drew only the first few songs into the shuffle and then played the rest in original order. Reported by znouetp, thank you. IMPROVED: when Alexa finds several artists with similar names, the follow-up question now makes clear you can keep answering no to hear the other matches."
