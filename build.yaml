changelog: "Song search is now much more forgiving: titles stored with abbreviations (\"Decatur St.\") are found when you say the full word (\"Decatur Street\"), and a single misheard word no longer blocks an otherwise correct request. The skill also asks for confirmation instead of silently playing a loosely-matching artist when it did not understand what you said, no longer fails with \"something went wrong\" when a dialog prompt and background entity updates collide, and intermittent request failures triggered by editing settings while the skill is busy are fixed. New troubleshooting guides in the README cover reverse-proxy/Cloudflare setups, missing seek bar, follow-me behavior and more."
