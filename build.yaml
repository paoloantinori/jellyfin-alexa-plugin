changelog: "Podcast playback now works: the skill was querying Jellyfin for a podcast data model that does not exist, so every podcast request returned not-found. Podcasts are now found as music-library albums and their latest episode plays. Artist search handles foreign-name accent drift: when Alexa mishears an artist name (e.g. Koop heard as cup on an Italian Echo), the Double Metaphone phonetic match now resolves it instead of returning not-found or matching a coincidental substring. Follow-me transfer between Echo devices: the Italian infinitive form (chiedi a mia collezione di seguirmi) now routes correctly, and the announcement no longer falsely claims resuming from the previous position. Full per-language phonetic research (7 languages) is included as reference data for future accent-coverage work."
