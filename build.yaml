changelog: "Per-user config reworked into a clean expandable table (collapsed rows show status at a glance; expand to edit search/playback/invocation settings). Rebuilds of the interaction model are now scoped to your selected locale instead of rebuilding all 17, so the Rebuild button finishes in seconds rather than minutes. Ask for music by mood (e.g. 'play sleep music') in all 17 locales, with admin-customizable moods. Catalog sync now supports multiple locales beyond Italian, so non-English artist/album names are recognized when spoken with an accent. New per-user options for music delivery (seek bar vs. raw stream) and whether to announce each music track. When a song or album isn't found, the skill now suggests a plausible artist instead of a dead-end 'not found'. Video-audio endpoints now require a signed token (security hardening). Many smaller fixes: audiobook resume survives a crash, the 'searching…' hint no longer stalls, album ordering for multi-disc sets, and SSML escaping for metadata names. With huge thanks to @Gronsten (Mark Campbell) for the locale-scoped rebuild contribution."
